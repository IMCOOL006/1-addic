<style>
/* 1-addic · styles.css · the look (BUILD-PLAN 3.12), lane core. The paper harbor: deep teal, sand, terracotta and
   lantern gold by day; the lantern-lit night in dark. Red only for stuck or dangerous. System fonts.
   Tokens are HSL triplets used as hsl(var(--x)). The light :root, [data-theme="dark"] and the dark media block
   define the same variable set (the theme-parity guard compares them); no other block redefines a token.
   Phone first: bottom nav and the floating SOS button; a left nav from 900 px. 44 px targets, visible focus,
   no motion under reduced motion, no horizontal scroll at 390 px (wrapping and min-width:0, never hidden overflow). */
:root {
  --bg: 38 38% 94%;
  --surface: 40 45% 98%;
  --surface-2: 37 32% 89%;
  --text: 200 32% 13%;
  --muted: 200 14% 32%;
  --primary: 185 64% 23%;
  --primary-text: 0 0% 100%;
  --accent: 13 60% 37%;
  --gold: 41 88% 48%;
  --danger: 0 70% 36%;
  --border: 36 20% 74%;
  --focus: 185 80% 26%;
  --shadow: 200 35% 12%;
  --radius: 12px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
}
[data-theme="dark"] {
  --bg: 214 34% 9%;
  --surface: 214 28% 13%;
  --surface-2: 214 24% 18%;
  --text: 40 33% 91%;
  --muted: 38 14% 70%;
  --primary: 177 50% 52%;
  --primary-text: 214 34% 9%;
  --accent: 16 70% 63%;
  --gold: 42 92% 62%;
  --danger: 2 80% 70%;
  --border: 214 18% 30%;
  --focus: 42 92% 62%;
  --shadow: 0 0% 0%;
  --radius: 12px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 214 34% 9%;
    --surface: 214 28% 13%;
    --surface-2: 214 24% 18%;
    --text: 40 33% 91%;
    --muted: 38 14% 70%;
    --primary: 177 50% 52%;
    --primary-text: 214 34% 9%;
    --accent: 16 70% 63%;
    --gold: 42 92% 62%;
    --danger: 2 80% 70%;
    --border: 214 18% 30%;
    --focus: 42 92% 62%;
    --shadow: 0 0% 0%;
    --radius: 12px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
  }
}

/* ── Base ─────────────────────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html[data-text-size="large"] { font-size: 112.5%; }
html[data-text-size="larger"] { font-size: 125%; }
body {
  margin: 0;
  min-height: 100vh;
  background: hsl(var(--bg));
  color: hsl(var(--text));
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  overflow-wrap: anywhere;
}
[hidden] { display: none !important; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 var(--space-3); }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.0625rem; }
p { margin: 0 0 var(--space-3); }
a { color: hsl(var(--primary)); text-underline-offset: 2px; }
img, svg, video, canvas { max-width: 100%; }
pre { white-space: pre-wrap; }
table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid hsl(var(--focus)); outline-offset: 2px; }
.muted { color: hsl(var(--muted)); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ── Frame: top bar, main, nav, SOS button ────────────────────────────────────────────────── */
#app { min-height: 100vh; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--space-2); min-width: 0; min-height: 52px;
  padding: var(--space-1) var(--space-2) var(--space-1) var(--space-4);
  background: hsl(var(--surface)); border-bottom: 1px solid hsl(var(--border));
}
.app-name { font-weight: 700; white-space: nowrap; }
.saved-label { flex: 1; min-width: 0; font-size: 0.8125rem; line-height: 1.25; color: hsl(var(--muted)); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  min-width: 44px; min-height: 44px; padding: 0; border: 0; border-radius: var(--radius);
  background: transparent; color: hsl(var(--text)); cursor: pointer; text-decoration: none;
}
.icon-btn:hover { background: hsl(var(--surface-2)); }
main { display: block; min-width: 0; max-width: 760px; margin: 0 auto; padding: var(--space-4); }
main:focus { outline: none; }
.page { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; padding-bottom: env(safe-area-inset-bottom, 0px);
  background: hsl(var(--surface)); border-top: 1px solid hsl(var(--border));
}
.nav a {
  flex: 1 1 0; min-width: 0; min-height: 64px; padding: var(--space-1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 0.8125rem; text-align: center; color: hsl(var(--muted)); text-decoration: none;
}
.nav a:hover { color: hsl(var(--text)); }
.nav a[aria-current="page"] { color: hsl(var(--primary)); font-weight: 700; box-shadow: inset 0 3px 0 hsl(var(--primary)); }

/* The SOS button sits above every layer a page or a tour can add (never covered by a coach mark). */
.sos-btn {
  position: fixed; right: var(--space-4); bottom: calc(64px + var(--space-4) + env(safe-area-inset-bottom, 0px)); z-index: 60;
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: hsl(var(--accent)); color: hsl(var(--primary-text));
  font-weight: 800; letter-spacing: 0.02em; text-decoration: none;
  box-shadow: 0 2px 10px hsl(var(--shadow) / 0.35);
}
.sos-btn:hover { filter: brightness(1.08); }
.sos-btn:focus-visible { outline-offset: 3px; }

@media (min-width: 720px) {
  .nav a { font-size: 0.9375rem; }
}
@media (min-width: 900px) {
  #app { padding: 0 0 0 220px; }
  .nav {
    top: 0; right: auto; width: 220px; flex-direction: column; padding: 64px 0 var(--space-4);
    border-top: 0; border-right: 1px solid hsl(var(--border));
  }
  .nav a { flex: 0 0 auto; min-height: 48px; flex-direction: row; justify-content: flex-start; padding: 0 var(--space-5); font-size: 1rem; }
  .nav a[aria-current="page"] { box-shadow: inset 3px 0 0 hsl(var(--primary)); background: hsl(var(--surface-2)); }
  .sos-btn { bottom: var(--space-5); right: var(--space-5); width: 64px; height: 64px; }
  main { padding: var(--space-5); }
}

/* ── Layout helpers ───────────────────────────────────────────────────────────────────────── */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-width: 0; }
.row > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.stack > * { margin-top: 0; margin-bottom: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: var(--space-3); }

/* ── Buttons ──────────────────────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px; max-width: 100%; padding: 10px 18px;
  border: 1px solid hsl(var(--muted) / 0.6); border-radius: var(--radius);
  background: hsl(var(--surface)); color: hsl(var(--text));
  font-weight: 600; line-height: 1.25; text-align: center; text-decoration: none; cursor: pointer;
}
.btn:hover { background: hsl(var(--surface-2)); }
.btn.primary { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-text)); }
.btn.primary:hover { background: hsl(var(--primary) / 0.9); }
.btn.ghost { background: transparent; border-color: transparent; color: hsl(var(--primary)); }
.btn.ghost:hover { background: hsl(var(--surface-2)); }
.btn.danger { background: hsl(var(--danger)); border-color: hsl(var(--danger)); color: hsl(var(--primary-text)); }
.btn.big { min-height: 56px; width: 100%; font-size: 1.125rem; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }

/* ── Building blocks ──────────────────────────────────────────────────────────────────────── */
.card {
  min-width: 0; padding: var(--space-4);
  background: hsl(var(--surface)); border: 1px solid hsl(var(--border)); border-radius: var(--radius);
  box-shadow: 0 1px 2px hsl(var(--shadow) / 0.08);
}
.card-title { font-size: 1.125rem; margin: 0 0 var(--space-2); }
.card-foot { margin-top: var(--space-3); }
.tile {
  display: flex; flex-direction: column; min-width: 0; padding: var(--space-3);
  background: hsl(var(--surface-2)); border-radius: var(--radius);
}
.tile-value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.tile-label { font-size: 0.875rem; color: hsl(var(--muted)); }
.tile-sub { font-size: 0.8125rem; color: hsl(var(--muted)); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); min-width: 0; }
.chip {
  min-height: 44px; max-width: 100%; padding: 8px 14px;
  border: 1px solid hsl(var(--muted) / 0.7); border-radius: 999px;
  background: hsl(var(--surface)); color: hsl(var(--text)); cursor: pointer; line-height: 1.25;
}
.chip:hover { background: hsl(var(--surface-2)); }
.chip.on, .chip[aria-pressed="true"] { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-text)); font-weight: 700; }
.ring { position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.ring svg { display: block; width: 64px; height: 64px; }
.ring-track { fill: none; stroke: hsl(var(--surface-2)); stroke-width: 4; }
.ring-fill { fill: none; stroke: hsl(var(--primary)); stroke-width: 4; stroke-linecap: round; }
.ring-text { position: absolute; top: 32px; left: 50%; transform: translate(-50%, -50%); font-size: 0.875rem; font-weight: 700; }
.ring-label { font-size: 0.8125rem; color: hsl(var(--muted)); text-align: center; }
.meter { height: 10px; min-width: 0; border-radius: 999px; background: hsl(var(--surface-2)); overflow: hidden; }
.meter-fill { display: block; height: 100%; border-radius: inherit; background: hsl(var(--primary)); }
.empty {
  padding: var(--space-6) var(--space-4); text-align: center; color: hsl(var(--muted));
  border: 1px dashed hsl(var(--border)); border-radius: var(--radius);
}
.empty .btn { margin-top: var(--space-1); }
.render-fallback, .boot-failure { padding: var(--space-4); margin: 0; border-radius: var(--radius); background: hsl(var(--surface-2)); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--gold)); vertical-align: middle; }
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1); padding: 2px 10px; border-radius: 999px;
  background: hsl(var(--gold) / 0.2); border: 1px solid hsl(var(--gold)); font-size: 0.8125rem; font-weight: 600;
}
.tip { padding: var(--space-3) var(--space-4); border-radius: var(--radius); background: hsl(var(--gold) / 0.14); border: 1px solid hsl(var(--gold) / 0.6); }

/* ── Form fields ──────────────────────────────────────────────────────────────────────────── */
.form { min-width: 0; }
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field-label { font-weight: 600; margin: 0; }
.field-hint { margin: 0; font-size: 0.875rem; color: hsl(var(--muted)); }
.field-error { margin: 0; font-size: 0.875rem; font-weight: 600; color: hsl(var(--danger)); }
.field input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), .field select, .field textarea {
  width: 100%; max-width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid hsl(var(--muted)); border-radius: var(--radius);
  background: hsl(var(--surface)); color: hsl(var(--text));
}
.field textarea { min-height: 96px; resize: vertical; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: hsl(var(--danger)); }
.field input[type="range"] { width: 100%; min-height: 44px; margin: 0; accent-color: hsl(var(--primary)); }
.field input[type="checkbox"], .field input[type="radio"] { width: 22px; height: 22px; margin: 0; flex: 0 0 auto; accent-color: hsl(var(--primary)); }
.choices { border: 0; margin: 0; padding: 0; min-width: 0; }
.choices legend { padding: 0; margin-bottom: var(--space-1); }
.choice { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.choice label { flex: 1; min-width: 0; cursor: pointer; }
.slider-head { justify-content: space-between; }
.slider-value { font-weight: 700; }
.slider-ends { display: flex; justify-content: space-between; gap: var(--space-2); font-size: 0.8125rem; color: hsl(var(--muted)); }
.form-actions { margin-top: var(--space-1); }

/* ── Sheet (dialog#dialog): a bottom sheet on phones, a centred card from 720 px ──────────── */
dialog.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; margin: auto auto 0; padding: 0;
  border: 0; border-radius: 16px 16px 0 0; overflow: auto;
  background: hsl(var(--surface)); color: hsl(var(--text)); box-shadow: 0 -4px 24px hsl(var(--shadow) / 0.3);
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.45); }
.sheet-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-2) var(--space-1) var(--space-4); }
.sheet-title { flex: 1; min-width: 0; margin: 0; font-size: 1.125rem; }
/* Every sheet's own way to SOS (the page's SOS button is inert behind a modal). */
.sheet-sos {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  min-width: 44px; min-height: 44px; padding: 0 14px; border-radius: 22px;
  background: hsl(var(--accent)); color: hsl(var(--primary-text)); font-weight: 800; text-decoration: none;
}
.sheet-sos:focus-visible { outline-offset: 3px; }
.sheet-body { padding: var(--space-2) var(--space-4) var(--space-4); }
.sheet-actions { justify-content: flex-end; padding: 0 var(--space-4) var(--space-4); }
@media (min-width: 720px) {
  dialog.sheet { margin: auto; border-radius: 16px; }
}

/* ── Toasts: above the SOS button, never covering it ──────────────────────────────────────── */
.toasts {
  position: fixed; left: var(--space-4); right: var(--space-4); z-index: 40;
  bottom: calc(64px + 56px + var(--space-6) + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2); pointer-events: none;
}
.toast {
  max-width: min(480px, 100%); padding: 10px 16px; border-radius: var(--radius); pointer-events: auto;
  background: hsl(var(--text)); color: hsl(var(--bg)); box-shadow: 0 2px 12px hsl(var(--shadow) / 0.3);
  animation: toast-in 0.2s ease-out;
}
.toast-ok { box-shadow: inset 4px 0 0 hsl(var(--primary)), 0 2px 12px hsl(var(--shadow) / 0.3); }
.toast-warn { box-shadow: inset 4px 0 0 hsl(var(--gold)), 0 2px 12px hsl(var(--shadow) / 0.3); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (min-width: 900px) {
  .toasts { left: calc(220px + var(--space-4)); bottom: var(--space-5); }
}

/* ── Coach marks (#coach; game-tutorials fills it): dim layer, spotlight ring, popover ────── */
.coach { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.coach-overlay { position: absolute; inset: 0; pointer-events: auto; }
.coach-ring {
  position: absolute; border-radius: var(--radius); pointer-events: none;
  box-shadow: 0 0 0 4px hsl(var(--gold)), 0 0 0 9999px hsl(var(--shadow) / 0.55);
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.coach-pop {
  position: absolute; max-width: min(320px, calc(100vw - 32px)); padding: var(--space-4); pointer-events: auto;
  background: hsl(var(--surface)); color: hsl(var(--text)); border-radius: var(--radius);
  box-shadow: 0 4px 24px hsl(var(--shadow) / 0.35);
}
.coach-pop p { margin: 0 0 var(--space-3); }
.coach-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); }

/* ── Lessons ──────────────────────────────────────────────────────────────────────────────── */
.lesson-card { border-left: 4px solid hsl(var(--gold)); }
.lesson-card.current { border-left-color: hsl(var(--primary)); }
.lesson-card .lesson-meta { font-size: 0.875rem; color: hsl(var(--muted)); margin: 0 0 var(--space-2); }
.lesson-body { max-width: 65ch; font-size: 1.0625rem; line-height: 1.6; }
.lesson-body h2 { margin-top: var(--space-5); }
.lesson-body blockquote { margin: var(--space-4) 0; padding: var(--space-2) var(--space-4); border-left: 4px solid hsl(var(--accent)); background: hsl(var(--surface-2)); border-radius: 0 var(--radius) var(--radius) 0; }

/* ── SOS: big targets, one hand, nothing else on the screen ───────────────────────────────── */
.sos-page { max-width: 560px; margin: 0 auto; }
.sos-page h1 { font-size: 1.75rem; }
.sos-page p { font-size: 1.125rem; }
.sos-page .btn { min-height: 56px; width: 100%; font-size: 1.125rem; }
.sos-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.sos-target {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-1) var(--space-3);
  min-height: 64px; padding: var(--space-3) var(--space-4);
  background: hsl(var(--surface)); color: hsl(var(--text)); text-decoration: none;
  border: 2px solid hsl(var(--border)); border-radius: var(--radius); font-size: 1.0625rem;
}
.sos-target:hover { border-color: hsl(var(--primary)); }
.sos-target-name { flex: 1 1 12em; min-width: 0; }
.sos-target-number { font-weight: 700; font-size: 1.25rem; color: hsl(var(--primary)); white-space: nowrap; }
[data-route="sos"] .tip, [data-route="sos"] .dot, [data-route="sos"] .coach-ring, [data-route="sos"] .coach-pop,
[data-route="sos"] #coach, [data-route="sos"] .coach-overlay { display: none !important; } /* the whole layer (RS9) */
.lock-page { max-width: 420px; margin: 0 auto; }

/* ── The harbor (placeholder box; the harbor lane draws the scene inside) ──────────────────── */
.harbor {
  position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
  background: linear-gradient(hsl(var(--surface-2)), hsl(var(--primary) / 0.35));
}
.harbor svg { display: block; width: 100%; height: 100%; }

/* ── Calm and discreet ────────────────────────────────────────────────────────────────────── */
body.calm .xp, body.calm .badge, body.calm .harbor { display: none !important; }
[data-counters="off"] .counter { display: none !important; }
/* Discreet before ui-core paints the chrome (RS7): the head script sets html[data-discreet]; ui-core sets data-route. */
html[data-discreet]:not([data-route]) #app-name, html[data-discreet]:not([data-route]) #sos-btn { font-size: 0; }
html[data-discreet]:not([data-route]) #app-name::after { content: "Notebook"; font-size: 1rem; }
html[data-discreet]:not([data-route]) #sos-btn::after { content: "Help"; font-size: 1rem; }

/* ── Motion ───────────────────────────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
[data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after {
  animation: none !important; transition: none !important; scroll-behavior: auto !important;
}

/* ── Print: only the document in #print-root when there is one, never the nav, SOS or toasts ─ */
.print-root { display: none; }
@media print {
  body { background: #fff; color: #000; }
  .topbar, .nav, .sos-btn, .toasts, .coach, dialog { display: none !important; }
  #app { padding: 0; }
  body:has(#print-root > *) #app { display: none; }
  .print-root { display: block; }
  .card { box-shadow: none; border-color: #999; break-inside: avoid; }
  a { color: #000; }
  @page { margin: 16mm; }
}

/* -- end core -- */
/* Other lanes append their own section after this line, headed by a comment naming the lane
   (for example a comment reading "-- learn --"). Tokens are never redefined there. */
</style>
</head>
<body>
<!-- 1-addic shell: the body markup (BUILD-PLAN 3.1; ids are the contract of tracks/CORE/contracts/core.md, section A).
     ui-core.js fills it. Owned by lane core; other lanes change it by request only. -->

    { q: 'How do I get help in a craving right now?', a: 'Tap SOS, then "I\'m craving". Rate it if you want, start the 15-minute wave, and pick a tool. Guide me runs the tools for you.', route: '#/sos' },
    { q: 'How do I find emergency and crisis numbers?', a: 'SOS → "I need urgent help". The numbers also sit on the lock screen, so they never need your PIN.', route: '#/sos/urgent' },
    { q: 'How do I log a craving or a feeling?', a: 'Tap the plus button on Track or Today. Pick Craving or Feeling, rate it, tap the chips, save.', route: '#/track' },
    { q: 'How do I do the evening check-in?', a: 'On Today after 5 pm the check-in card appears. Mood, peak craving, pleasant activities, sleep, and whether you used today.', route: '#/today' },
    { q: 'How do I build my Reasons Card?', a: 'Workbook → My Why → Reasons Card. Or do Step 1 in Learn, which builds it through the Decisional Balance.', route: '#/workbook/reasons' },
    { q: 'How do I add a Safety Net?', a: 'Workbook → My People → Support Network → Add person. Give them the role Safety Net and a number.', route: '#/workbook/network' },
    { q: 'How do I plan for a risky situation?', a: 'Actions → Battle Plans → New. Write the situation, your plan, two backups, a buddy and an exit.', route: '#/actions/battle' },
    { q: 'How do I put a thought on trial?', a: 'Actions → Tools → Put It On Trial, or from a logged red-flag thought. The closing statement is saved as a Comeback.', route: '#/tools/trial' },
    { q: 'How do I do the Weekly Review?', a: 'Actions → Weekly Review. Five short screens: last week, the forecast check, motivation, the week ahead, want-tos.', route: '#/actions/review' },
    { q: 'How do I back up my data?', a: 'Settings → Your data → Export backup. A .json file downloads. Keep it somewhere safe. Import it on any device.', route: '#/settings/data' },
    { q: 'How do I use this on my phone?', a: 'Copy 1-addic.html to the phone and open it in Chrome. Export a backup here and import it there; the phone keeps its own data.', route: '#/settings/data' },
    { q: 'How do I set or remove the PIN?', a: 'Settings → Privacy → App lock. With a PIN, your data is encrypted in the browser. Forgetting it means starting over from a backup.', route: '#/settings/privacy' },
    { q: 'How do I turn the harbor and points off?', a: 'Settings → Look → Calm mode. Everything keeps working; the game layer disappears.', route: '#/settings/look' },
    { q: 'How do I see what the techniques are based on?', a: 'Settings → About & evidence lists every technique with its sources, and every lesson wrap has a "Why this works" link.', route: '#/settings/about' },
    { q: 'How do I replay the tour or a tutorial?', a: 'Settings → Help & tutorials. Every tutorial and training drill can be replayed any time.', route: '#/settings/help' },
    { q: 'How do I share my plan with a therapist or sponsor?', a: 'Workbook → My Recovery Plan → Print / PDF. Or Settings → Your data → Print logs.', route: '#/workbook/plan' },
  ],

  /* ── Evidence (docs/evidence-references.md). Claims are stated no more strongly than the source. */
  references: [
    { id: 'R1', claim: 'Triggers, high-risk situations, small "irrelevant" decisions, urge surfing and the idea that a slip need not become a relapse come from relapse prevention, the CBT approach developed by Alan Marlatt and colleagues.', cite: 'Marlatt GA, Gordon JR (eds). Relapse Prevention: Maintenance Strategies in the Treatment of Addictive Behaviors. Guilford Press; 1985.', type: 'Foundational book', usedBy: ['m4', 'm5', 'm6', 'sos'] },
    { id: 'R2', claim: 'The updated relapse prevention model, including coping skills and self-efficacy in high-risk situations.', cite: 'Marlatt GA, Donovan DM (eds). Relapse Prevention. 2nd ed. Guilford Press; 2005.', type: 'Book', usedBy: ['m5', 'm6', 'm10'] },
    { id: 'R3', claim: 'Relapse is a process with warning signs, not a single event, and planning for high-risk situations lowers the risk.', cite: 'Witkiewitz K, Marlatt GA. Relapse prevention for alcohol and drug problems: That was Zen, this is Tao. American Psychologist. 2004;59(4):224–235.', doi: '10.1037/0003-066X.59.4.224', type: 'Review', usedBy: ['m10', 'radar', 'battlePlans'] },
    { id: 'R4', claim: 'How you interpret a slip ("I\'ve blown it") shapes whether it turns into a relapse: the abstinence violation effect, which this app calls the spiral.', cite: 'Curry S, Marlatt GA, Gordon JR. Abstinence violation effect: Validation of an attributional construct with smoking cessation. Journal of Consulting and Clinical Psychology. 1987;55(2):145–149.', doi: '10.1037/0022-006X.55.2.145', type: 'Study', usedBy: ['m5', 'slip'] },
    { id: 'R5', claim: 'Across 53 randomized trials, CBT produced a small but reliable reduction in alcohol and drug use, strongest for cannabis.', cite: 'Magill M, Ray LA. Cognitive-behavioral treatment with adult alcohol and illicit drug users: A meta-analysis of randomized controlled trials. Journal of Studies on Alcohol and Drugs. 2009;70(4):516–527.', doi: '10.15288/jsad.2009.70.516', type: 'Meta-analysis', usedBy: ['m5', 'm6'] },
    { id: 'R6', claim: 'A 2019 analysis of 30 randomized trials confirmed CBT\'s benefit over minimal treatment; against other active therapies the differences were small or not significant.', cite: 'Magill M, Ray L, Kiluk B, et al. A meta-analysis of cognitive-behavioral therapy for alcohol or other drug use disorders: Treatment efficacy by contrast condition. Journal of Consulting and Clinical Psychology. 2019;87(12):1093–1105.', doi: '10.1037/ccp0000447', type: 'Meta-analysis', usedBy: ['m5', 'm6'] },
    { id: 'R7', claim: 'Putting thoughts on trial and spotting thinking traps are cognitive therapy techniques adapted for addiction.', cite: 'Beck AT, Wright FD, Newman CF, Liese BS. Cognitive Therapy of Substance Abuse. Guilford Press; 1993.', type: 'Book', usedBy: ['m5', 'm6', 'm9'] },
    { id: 'R8', claim: 'Mixed feelings about change are normal, and motivation grows when people voice their own reasons rather than being told.', cite: 'Miller WR, Rollnick S. Motivational Interviewing: Helping People Change. 3rd ed. Guilford Press; 2013.', type: 'Book', usedBy: ['onboarding', 'm3'] },
    { id: 'R9', claim: 'People move through stages of change (precontemplation, contemplation, preparation, action, maintenance) and can move back and forth.', cite: 'Prochaska JO, DiClemente CC. Stages and processes of self-change of smoking: Toward an integrative model of change. Journal of Consulting and Clinical Psychology. 1983;51(3):390–395.', doi: '10.1037/0022-006X.51.3.390', type: 'Study and theory', usedBy: ['onboarding', 'm3', 'roadmap'] },
    { id: 'R10', claim: 'Motivational interviewing reduces substance use more than no treatment; whether it beats other treatments is unclear.', cite: 'Smedslund G, Berg RC, Hammerstrøm KT, et al. Motivational interviewing for substance abuse. Cochrane Database of Systematic Reviews. 2011;(5):CD008063; updated 2023 (CD008063.pub3).', doi: '10.1002/14651858.CD008063.pub2', type: 'Cochrane review', usedBy: ['m3'] },
    { id: 'R11', claim: 'Believing you can succeed (self-efficacy) predicts behaviour change.', cite: 'Bandura A. Self-efficacy: Toward a unifying theory of behavioral change. Psychological Review. 1977;84(2):191–215.', doi: '10.1037/0033-295X.84.2.191', type: 'Theory', usedBy: ['m3', 'mastery'] },
    { id: 'R12', claim: 'SOBER breathing, riding an urge with the breath, and accepting discomfort without acting on it come from mindfulness-based relapse prevention (MBRP).', cite: 'Bowen S, Chawla N, Marlatt GA. Mindfulness-Based Relapse Prevention for Addictive Behaviors: A Clinician\'s Guide. Guilford Press; 2011 (2nd ed. with Grow J; 2021).', type: 'Treatment manual', usedBy: ['m7', 'sos'] },
    { id: 'R13', claim: 'In a randomized trial of 286 people, MBRP led to fewer drug-use days and less heavy drinking at 12 months than usual aftercare.', cite: 'Bowen S, Witkiewitz K, Clifasefi SL, et al. Relative efficacy of mindfulness-based relapse prevention, standard relapse prevention, and treatment as usual for substance use disorders: A randomized clinical trial. JAMA Psychiatry. 2014;71(5):547–556.', doi: '10.1001/jamapsychiatry.2013.4546', type: 'Randomized trial', usedBy: ['m7', 'sos'] },
    { id: 'R14', claim: 'Mindfulness means paying attention on purpose, in the present moment, without judgment.', cite: 'Kabat-Zinn J. Full Catastrophe Living. Delacorte; 1990 (revised ed. Bantam; 2013).', type: 'Book', usedBy: ['m7'] },
    { id: 'R15', claim: 'Scheduling activities (behavioural activation) on its own worked as well as full cognitive therapy for depression.', cite: 'Jacobson NS, Dobson KS, Truax PA, et al. A component analysis of cognitive-behavioral treatment for depression. Journal of Consulting and Clinical Psychology. 1996;64(2):295–304.', doi: '10.1037/0022-006X.64.2.295', type: 'Randomized trial', usedBy: ['m8', 'm9'] },
    { id: 'R16', claim: 'A brief behavioural activation treatment improved depression in people in drug treatment (a small randomized pilot of 44 people).', cite: 'Daughters SB, Braun AR, Sargeant MN, et al. Effectiveness of a brief behavioral treatment for inner-city illicit drug users with elevated depressive symptoms: The Life Enhancement Treatment for Substance Use (LETS Act!). Journal of Clinical Psychiatry. 2008;69(1):122–129.', type: 'Pilot randomized trial', usedBy: ['m8', 'm9'] },
    { id: 'R17', claim: 'The source workbook cites this study for its finding that involvement in a wide range of enjoyable, drug-free activities predicted staying sober, whichever treatment people had.', cite: 'Farabee D, Rawson R, McCann M. Adoption of drug avoidance activities among patients in contingency management and cognitive-behavioral treatments. Journal of Substance Abuse Treatment. 2002;23(4):343–350.', type: 'Study', usedBy: ['m8', 'activities', 'game'] },
    { id: 'R18', claim: 'Rebuilding a rewarding life (work, family, friends, leisure) reduced drinking: the community reinforcement approach.', cite: 'Hunt GM, Azrin NH. A community-reinforcement approach to alcoholism. Behaviour Research and Therapy. 1973;11(1):91–104.', doi: '10.1016/0005-7967(73)90072-7', type: 'Study', usedBy: ['m4', 'm8'] },
    { id: 'R19', claim: 'Rewarding verified abstinence (contingency management) helps people stop using. This app rewards practice instead, because it cannot verify abstinence.', cite: 'Higgins ST, Delaney DD, Budney AJ, et al. A behavioral approach to achieving initial cocaine abstinence. American Journal of Psychiatry. 1991;148(9):1218–1224.', doi: '10.1176/ajp.148.9.1218', type: 'Study', usedBy: ['game'] },
    { id: 'R20', claim: 'Across 47 comparisons, contingency management had a moderate effect on abstinence, larger for opioids and cocaine.', cite: 'Prendergast M, Podus D, Finney J, Greenwell L, Roll J. Contingency management for treatment of substance use disorders: A meta-analysis. Addiction. 2006;101(11):1546–1560.', doi: '10.1111/j.1360-0443.2006.01581.x', type: 'Meta-analysis', usedBy: ['game'] },
    { id: 'R21', claim: 'The Matrix Model (the source of "be smart, not strong") combines CBT, motivational and family elements; in a large trial, people attended more sessions and had longer abstinence during treatment than with usual care.', cite: 'Rawson RA, Marinelli-Casey P, Anglin MD, et al. A multi-site comparison of psychosocial approaches for the treatment of methamphetamine dependence. Addiction. 2004;99(6):708–717.', doi: '10.1111/j.1360-0443.2004.00707.x', type: 'Randomized trial', usedBy: ['m4'] },
    { id: 'R22', claim: 'A 2020 Cochrane review (27 studies, 10,565 people) found that AA and 12-step facilitation increase abstinence at least as much as other treatments, at lower cost.', cite: 'Kelly JF, Humphreys K, Ferri M. Alcoholics Anonymous and other 12-step programs for alcohol use disorder. Cochrane Database of Systematic Reviews. 2020;3:CD012880.', doi: '10.1002/14651858.CD012880.pub2', type: 'Cochrane review', usedBy: ['m4', 'resources'] },
    { id: 'R23', claim: 'Relapse rates in addiction (40–60%) are similar to those in other chronic illnesses; a lapse means the plan needs adjusting, not that treatment failed.', cite: 'McLellan AT, Lewis DC, O\'Brien CP, Kleber HD. Drug dependence, a chronic medical illness: Implications for treatment, insurance, and outcomes evaluation. JAMA. 2000;284(13):1689–1695.', doi: '10.1001/jama.284.13.1689', type: 'Review', usedBy: ['m2', 'm5', 'slip'] },
    { id: 'R24', claim: 'In a small imaging study, dopamine function partly recovered after 12 to 17 months of abstinence: the brain heals.', cite: 'Volkow ND, Chang L, Wang GJ, et al. Loss of dopamine transporters in methamphetamine abusers recovers with protracted abstinence. Journal of Neuroscience. 2001;21(23):9414–9418.', doi: '10.1523/JNEUROSCI.21-23-09414.2001', type: 'Imaging study (5 people)', usedBy: ['m2'] },
    { id: 'R25', claim: 'Across 22 randomized trials, exercise raised abstinence rates and eased withdrawal, anxiety and depression.', cite: 'Wang D, Wang Y, Wang Y, Li R, Zhou C. Impact of physical exercise on substance use disorders: A meta-analysis. PLoS ONE. 2014;9(10):e110728.', doi: '10.1371/journal.pone.0110728', type: 'Meta-analysis', usedBy: ['m4'] },
    { id: 'R26', claim: 'An exercise programme during residential treatment was studied for its effect on depression and anxiety in people recovering from methamphetamine use.', cite: 'Rawson RA, Chudzynski J, Gonzales R, et al. The impact of exercise on depression and anxiety symptoms among abstinent methamphetamine-dependent individuals in a residential treatment setting. Journal of Substance Abuse Treatment. 2015;57:36–40.', doi: '10.1016/j.jsat.2015.04.007', type: 'Trial', usedBy: ['m4'] },
    { id: 'R27', claim: '150 minutes of moderate activity a week plus strength training twice a week.', cite: 'U.S. Department of Health and Human Services. Physical Activity Guidelines for Americans. 2nd ed. 2018.', url: 'https://health.gov/our-work/nutrition-physical-activity/physical-activity-guidelines', type: 'Guideline', usedBy: ['m4'] },
    { id: 'R28', claim: 'Addiction is a treatable condition; medication plus behavioural therapy works best for many people; returning to use does not mean treatment failed.', cite: 'National Institute on Drug Abuse. Principles of Drug Addiction Treatment: A Research-Based Guide. 3rd ed. 2018; and Drugs, Brains, and Behavior: The Science of Addiction.', url: 'https://nida.nih.gov', type: 'Guideline', usedBy: ['m1', 'm2', 'resources'] },
    { id: 'R29', claim: 'Motivation lasts when people feel autonomy, competence and relatedness (self-determination theory), which the game design is built on.', cite: 'Deci EL, Ryan RM. The "what" and "why" of goal pursuits: Human needs and the self-determination of behavior. Psychological Inquiry. 2000;11(4):227–268.', doi: '10.1207/S15327965PLI1104_01', type: 'Theory', usedBy: ['game'] },
    { id: 'R30', claim: 'Gamification can help health behaviours, but the evidence is modest and mixed, so the game stays gentle and can be switched off.', cite: 'Johnson D, Deterding S, Kuhn KA, Staneva A, Stoyanov S, Hides L. Gamification for health and wellbeing: A systematic review of the literature. Internet Interventions. 2016;6:89–106.', doi: '10.1016/j.invent.2016.10.002', type: 'Systematic review', usedBy: ['game'] },
    { id: 'R31', claim: 'Mental health conditions are common alongside addiction, which is why persistent low mood gets a gentle nudge toward professional help.', cite: 'Regier DA, Farmer ME, Rae DS, et al. Comorbidity of mental disorders with alcohol and other drug abuse: Results from the Epidemiologic Catchment Area (ECA) Study. JAMA. 1990;264(19):2511–2518.', doi: '10.1001/jama.1990.03450190043026', type: 'Epidemiological study', usedBy: ['m9'] },

  glossary: [
    { term: 'Addicted brain', def: 'The fast, conditioned part of you that wants the substance and finds reasons for it. It speaks in red-flag thoughts.' },
    { term: 'Rational brain', def: 'The part of you that weighs things up and chooses. Practice makes it stronger. In this app it is your companion.' },
    { term: 'Trigger', def: 'Anything that starts the chain toward using: a feeling inside you, or a person, place, situation or thing around you.' },
    { term: 'The chain', def: 'Trigger → thought → craving → use. Noticing any link gives you a place to step out.' },
    { term: 'Red-flag thought', def: 'A thought that gives you permission to use. "Just one." "Nobody has to know."' },
    { term: 'Thinking trap', def: 'One of six common distortions that produce bad feelings, which then produce red-flag thoughts.' },
    { term: 'Craving', def: 'A strong wish to use, felt in the body, in emotions and in thoughts. Most pass in about fifteen minutes.' },
    { term: 'Ride the wave', def: 'Let a craving rise, peak and fall without acting on it. Also called urge surfing.' },
    { term: 'SOBER', def: 'Stop · Observe · Breathe · Expand · Respond. A one-to-five-minute way to step out of autopilot.' },
    { term: 'Slip', def: 'A first use after a period without. Not yet a relapse. What you tell yourself next decides what it becomes.' },
    { term: 'Relapse', def: 'A slip that keeps going for days or weeks.' },
    { term: 'The spiral', def: 'Reading a slip as total failure, or as proof you cannot do it, which turns a slip into a relapse.' },
    { term: 'Safety Net', def: 'A person who supports your recovery and will not put it at risk.' },
    { term: 'Risky relationship', def: 'Someone who uses around you, or who brings the conflict and feelings that lead to urges.' },
    { term: 'Be smart, not strong', def: 'Avoid triggers instead of testing your willpower against them.' },
    { term: 'Small decision', def: 'A choice that does not look like it is about using but moves you toward it. The book this is based on calls them seemingly irrelevant decisions.' },
    { term: 'Battle Plan', def: 'A plan and two backups for a high-risk situation you can see coming.' },
    { term: 'Decisional Balance', def: 'Both sides of both choices: the good and the bad of continuing, and of stopping.' },
    { term: 'Reasons Card', def: 'The drawbacks of continuing and the benefits of stopping, in your own words. The first thing SOS shows.' },
    { term: 'Stage of change', def: 'Where you are with changing: not looking to, thinking about it, getting ready, doing it, keeping it going.' },
    { term: 'Momentum', def: 'The number of days in the last fourteen on which you practised something. It never drops to zero because of one day.' },
    { term: 'Mastery', def: 'A skill levels up with use: 1, 3, 7, 15 and 30 uses.' },
    { term: 'Calm mode', def: 'The game layer switched off: no harbor, no points. Everything else keeps working.' },
    { term: 'Pleasant activity', def: 'Anything you would rate six or more out of ten for enjoyment. One a day is the goal.' },
    { term: 'Should-dos and want-tos', def: 'Responsibilities, and the things you do because you enjoy them. Balance is the aim.' },
    { term: 'Pleasure prediction', def: 'Guess how much you will enjoy something, do it anyway, rate it afterwards, compare.' },
    { term: 'Behavioural activation', def: 'Scheduling enjoyable and meaningful activities to lift mood and leave less room for using.' },
    { term: 'Give it a beat', def: 'A pause before acting on anger: breathe, count, step away, say "I need a minute".' },
    { term: 'Warning sign', def: 'A shift in mood, thinking or behaviour that shows up days or weeks before a relapse.' },
    { term: 'Weekly Review', def: 'Five minutes a week to look back, check the forecast, and plan for the risky moments ahead.' },
    { term: 'Forecast check', def: 'In the Weekly Review: the rough weather you planned for, next to what your logbook recorded. Reflection, never a score.' },
    { term: 'Mindfulness', def: 'Paying attention on purpose, in the present moment, without judging what you find.' },
    { term: 'Acceptance', def: 'Letting a feeling be there without letting it decide what you do.' },
    { term: 'Tolerance', def: 'Needing more for the same effect.' },
    { term: 'Withdrawal', def: 'The rough physical and emotional effects as a substance leaves the body. For alcohol and sedatives it can be dangerous: see a doctor.' },
    { term: 'Dopamine', def: 'A brain messenger involved in wanting and reward. Substances flood it, then deplete it, which is why ordinary pleasures go flat for a while.' },
    { term: 'Conditioned cue', def: 'A person, place, thing or feeling that the brain has linked to using, so that it now triggers a craving on its own.' },
    { term: 'Self-efficacy', def: 'Believing you can do it. It predicts success, and it grows with every skill you use.' },
    { term: 'Companion', def: 'The voice of your rational brain in this app. You can rename it in Settings.' },
  ],
};

{ id: 'm0', step: null, name: 'Start Here', harbor: 'The harbor gate', book: 'Intro',
  blurb: 'What this is, how it thinks, and a safe practice run of SOS before you ever need it.',
  unlocks: [], lessons: [
  { id: 'm0-l1', title: 'What this is, and what it is not', minutes: 3,
    moment: { cast: 'meera', text: 'It is 9:40 pm. The flat is quiet, the dishes are done, and Meera has just opened this app for the first time, mostly to have something in her hands that is not a glass.' },
    cards: [
      { title: 'A skills coach, in your pocket', text: 'This app teaches the skills that help people stay away from alcohol and drugs, and then helps you use them in the moments that matter. The skills come from three well-studied approaches: cognitive behavioural therapy, motivational interviewing and mindfulness.' },
      { title: 'Not treatment, not a diagnosis', text: 'It will never tell you what you "are". It does not replace a doctor, a counsellor, a group or medication. If you drink heavily every day, or take sedatives or opioids every day, talk to a doctor before stopping: sudden withdrawal can be dangerous.' },
      { title: 'Built around the hard moment', text: 'The most important button is SOS. Craving, hard feeling, slip or emergency: one tap, works offline, no reading required. Everything else exists to make that button more useful to you over time.' },
      { title: 'Your words, reflected back', text: 'The strongest content here is what you write: your reasons, your people, your answers to your own thoughts. The app saves them and hands them back exactly when you need them.' },
    ],
    checks: [ { q: 'What happens when you tap SOS?', options: [
      { t: 'It shows a lesson about cravings', ok: false, why: 'Never inside SOS. SOS is tools only: ride the wave, remind me why, call someone, distract me, talk back.' },
      { t: 'It walks you through the next fifteen minutes with your own tools', ok: true, why: 'Yes. A craving usually peaks and fades in about fifteen minutes. SOS helps you get to the other side.' },
      { t: 'It contacts someone for you', ok: false, why: 'Nothing leaves your device unless you tap a call or text button yourself.' } ] } ],
    tryIt: { route: '#/sos?drill=1', label: 'Run the SOS practice drill (1 minute, sample data)' },
    wrap: { built: 'You know what the app is for, and you have seen SOS once in calm weather.', lives: 'SOS is the round button on every screen.', action: 'Add one Safety Net so "Call someone" has someone to call.', todo: 'Add one Safety Net in Workbook → My People' },
    refs: ['R32', 'R28'] },
  { id: 'm0-l2', title: 'Two brains, one harbor', minutes: 4,
    moment: { cast: 'raj', text: 'Raj does not think he has a problem. He also notices that by 7 pm every evening his hands know exactly where the packet is before his mind has decided anything.' },
    cards: [
      { title: 'The addicted brain', text: 'Part of you learned, over many repeats, that the substance fixes things fast. That part is quick, automatic and persuasive. It does not argue; it produces thoughts that already sound like decisions: "just one", "nobody has to know".' },
      { title: 'The rational brain', text: 'Another part of you weighs things up and chooses. It is slower, and it gets stronger every time you use it, the way a muscle does. Every skill in this app is a way of giving that part a turn to speak.' },
      { title: 'Cravings are weather', text: 'In this app your progress is drawn as a small harbor. Cravings are weather: they arrive, they pass. Skills are anchors. SOS is safe harbor. Nothing in the harbor ever decays or is taken away; it only gains light.' },
      { title: 'Your companion', text: 'The voice that guides you here is your rational brain, given a name. It never scolds. You can rename it in Settings, or switch the whole game layer off with Calm mode. Everything still works.' },
    ],
    checks: [ { q: '"Just one won\'t hurt." Which brain is talking?', options: [
      { t: 'The rational brain, weighing the evidence', ok: false, why: 'Weighing the evidence sounds like "last time I had one, what happened?" This is a ready-made permission.' },
      { t: 'The addicted brain, handing you a permission slip', ok: true, why: 'Yes. Red-flag thoughts arrive fully formed and sound reasonable. Noticing that is the first skill.' } ] } ],
    tryIt: { exercise: 'quick-reasons' },
    wrap: { built: 'Three quick reasons. They are the first thing SOS shows you.', lives: 'Workbook → My Why → Reasons Card.', action: 'Give your companion a name in Settings, or leave it as it is.', todo: null },
    refs: ['R7', 'R12'] },
  { id: 'm0-l3', title: 'How to use the journey', minutes: 3,
    moment: { cast: 'farhan', text: 'Farhan has been off the pills for seven months. He skipped to the last lesson first, then came back here, which is allowed.' },
    cards: [
      { title: 'Eleven stops', text: 'The journey has eleven stops: three to understand what happened, seven steps of skills, and a final stop where you build your own plan. Each lesson takes three to six minutes and ends with a real exercise, done with examples beside you.' },
      { title: 'Recommended, not locked', text: 'The order is recommended because each step uses the one before. Nothing is locked, and you can revisit Step 1 (your reasons) whenever motivation dips. SOS and the crisis numbers never depend on anything.' },
      { title: 'Practice before moving on', text: 'A stop is only really finished when you have used its skill a few times in real life. The roadmap shows both: lessons done, and skills practised.' },
      { title: 'A slip is data', text: 'If you use, nothing is wiped. Total days, points, badges and skills all stay. The app helps you stop the slip there, and learn from it. Honesty about a slip earns more here than pretending.' },
      { title: 'Your data stays here', text: 'Everything lives in this browser on this device. Nothing is uploaded. That means backups are your job: Settings → Your data → Export, once a week.' },
    ],
    checks: [ { q: 'You have had a hard week and missed your learning target. What does the roadmap do?', options: [
      { t: 'Shows the week in red and marks you overdue', ok: false, why: 'Never. Missed weeks do not turn red. The roadmap says "welcome back" and offers to re-plan.' },
      { t: 'Moves forward with you from where you are', ok: true, why: 'Yes. Pick up where you left off, or re-plan from this week. The pace is yours.' } ] } ],
    tryIt: { route: '#/learn/plan', label: 'Set your pace on the roadmap' },
    wrap: { built: 'A pace that fits your week.', lives: 'Learn → Roadmap → Plan view.', action: 'Go to Stop 1, Understand Addiction, when you are ready. Or straight to Step 1 if you want your reasons first.', todo: null },
    refs: ['R9', 'R32'] },
] },

{ id: 'm1', step: null, name: 'Understand Addiction', harbor: 'The Weather Station, ground floor', book: 1,
  blurb: 'How use becomes a need, the signs, why it happened to you, and how to ask for help.',
  unlocks: [], lessons: [
  { id: 'm1-l1', title: 'How a habit becomes a need', minutes: 4,
    moment: { cast: 'dev', text: 'Second year, exam week. A friend handed Dev one pill and said it would keep him sharp till morning. It did. Two years later he could not open a textbook without one.' },
    cards: [
      { title: 'Three reasons people start', text: 'Because it feels good. Because it takes something bad away: pain, worry, sadness. Or because it seems to help with something: studying, working late, being social. All three are ordinary human reasons.' },
      { title: 'It reliably delivered', text: 'At first the substance did what you expected, every time. That reliability is what trains the brain. A thing that works fast and always gets wired in deeper than anything slow and uncertain.' },
      { title: 'Tolerance and withdrawal', text: 'Then two things shift. You need more for the same effect (tolerance). And you feel bad when it wears off (withdrawal). Somewhere in there the reason changes from "to feel good" to "to feel normal".' },
      { title: 'When it overrides what you value', text: 'Addiction is when the need to use starts to win against things you care about more, and the use continues even though it is costing you. Wanting to be someone who can "take it or leave it" is normal. For most people here, leaving it entirely is the lower-risk path, at least for now.' },
    ],
    checks: [ { q: 'What marks the move from use to problem use?', options: [
      { t: 'Needing more, and feeling bad when it wears off', ok: true, why: 'Yes: tolerance and withdrawal. They are the body\'s way of saying the pattern has set in.' },
      { t: 'Using in the morning', ok: false, why: 'Timing varies a lot. The reliable markers are tolerance and withdrawal, and use that continues despite harm.' } ] } ],
    tryIt: null,
    wrap: { built: 'A clear picture of how the pattern formed. Not a verdict; a map.', lives: 'Nothing to save yet. The next lesson has the checklist.', action: 'Notice one moment today when you want to change how you feel. Just notice.', todo: null },
    refs: ['R28'] },
  { id: 'm1-l2', title: 'The signs', minutes: 4,
    moment: { cast: 'raj', text: 'Raj\'s sister sent him a list of "signs of addiction". He deleted it. Then he found himself reading it again at 2 am, ticking things in his head.' },
    cards: [
      { title: 'Five groups of signs', text: 'Tolerance (more for the same effect). Withdrawal (rough without it). Craving (hard to think about anything else). Control (breaking your own limits, failing to cut down). Consequences (work, money, relationships, health, the law), and using anyway.' },
      { title: 'Not a diagnosis', text: 'Ticking items on a list is information, not a label. Anything beyond tolerance and withdrawal usually means the substance is causing problems. Whether that is "addiction" is a question for a professional, if you want it answered.' },
      { title: 'What the list is for here', text: 'Your own ticks become some of your strongest reasons. The app can show them back to you when a craving says "it wasn\'t that bad".' },
    ],
    checks: [ { q: 'You ticked four items. What does the app conclude?', options: [
      { t: 'That you have an addiction', ok: false, why: 'It never concludes that. Only a professional can. The list is for your own understanding.' },
      { t: 'Nothing; it saves your answers for you to use later', ok: true, why: 'Right. Your ticks are yours. They can feed your Reasons Card if you choose.' } ] } ],
    tryIt: { exercise: 'signs-check' },
    wrap: { built: 'Your own signs, saved privately.', lives: 'Workbook → Know Myself → Signs.', action: 'If you ticked overdose, blackouts or heavy daily use, read Lesson 4 of this stop today.', todo: null },
    refs: ['R28'] },
  { id: 'm1-l3', title: 'Why me?', minutes: 4, sensitive: true,
    moment: { cast: 'kavita', text: 'Kavita\'s father drank. She swore she never would. For thirty years she didn\'t. Then her husband died, and the bottle her brother left behind after the funeral did not get thrown away.' },
    cards: [
      { title: 'Half of it is inherited', text: 'Genes account for roughly half of a person\'s vulnerability. That is not destiny; it is a loaded dice. Plenty of people with the genes never develop a problem, and some with none do.' },
      { title: 'Environment flips the switch', text: 'What tends to activate the risk: a chaotic or violent home, a parent or role model who used, friends who used in the teenage years, depression or anxiety, trauma, and starting young.' },
      { title: 'Not your fault. Your move.', text: 'Nobody chooses to become addicted. Understanding your risk is not about blame; it tells you which situations and feelings need the most care from here on. This list is private and hidden by default.' },
    ],
    checks: [ { q: 'You tick several risk factors. What does that mean?', options: [
      { t: 'You were more vulnerable than most, which helps explain how this happened', ok: true, why: 'Yes. More factors, more vulnerability. It explains; it does not excuse or condemn.' },
      { t: 'You cannot recover', ok: false, why: 'No. Risk factors shaped how you got here. They do not decide where you go.' } ] } ],
    tryIt: { exercise: 'risk-factors' },
    wrap: { built: 'A private understanding of why. Hidden behind a tap in the Workbook.', lives: 'Workbook → Know Myself → Risk factors (hidden).', action: 'If anything in that list stirred something painful, that is a good thing to tell a counsellor.', todo: null },
    refs: ['R28', 'R23'] },
  { id: 'm1-l4', title: 'Asking for help', minutes: 4,
    moment: { cast: 'dev', text: 'Dev stood outside the college counsellor\'s door for ten minutes rehearsing. In the end he said one sentence: "This is really hard to say, and I need help with pills." She said: "Thank you for telling me. Sit down."' },
    cards: [
      { title: 'Three parts of a help request', text: 'One: say that it is hard to say. That invites kindness. Two: state the concern briefly and directly; details can come when asked. Three: make a direct request: a referral, an appointment, confidentiality.' },
      { title: 'Confidentiality', text: 'Doctors and counsellors do not share what you tell them about substance use without your permission. The exceptions are a risk of serious harm to you or someone else, and abuse. Ask them to confirm it; they will.' },
      { title: 'Choosing a programme', text: 'If you look at treatment, ask: Is it evidence-based? Which therapies? Medication where it helps? What comes after? Three months or longer is common. The Resources screen has the full list of questions.' },
    ],
    checks: [ { q: 'The counsellor asks for details you are not ready to give. What now?', options: [
      { t: 'You have to tell everything or it will not work', ok: false, why: 'You set the pace. Brief and direct is enough to start; the rest can come when asked and when ready.' },
      { t: 'Say what you can, and make your request anyway', ok: true, why: 'Yes. The request is the point: "I need a referral", "I need this to stay between us".' } ] } ],
    tryIt: { exercise: 'help-request' },
    wrap: { built: 'A help request in your own words, ready to say or send.', lives: 'Workbook → My People → Scripts.', action: 'Decide who hears it first, and when.', todo: 'Say or send my help request' },
    refs: ['R28'] },
] },

{ id: 'm2', step: null, name: 'Your Brain Can Heal', harbor: 'The Lighthouse, ground floor', book: 2,
  blurb: 'What substances do to the brain, why that undermines choice, and how it heals. Short cards, quick checks.',
  unlocks: ['workbook', 'roadmapPlan', 'glossary'], lessons: [
  { id: 'm2-l1', title: 'The flood', minutes: 3,
    moment: { cast: 'dev', text: 'The first pill felt like the lights coming on. Dev remembers that feeling exactly. He does not remember the last fifty pills feeling like anything at all.' },
    cards: [
      { title: 'Dopamine', text: 'Food, music, a hug, a win: natural rewards release a brain messenger called dopamine, and the brain says "do that again". Alcohol and drugs release several times more than any natural reward, or stop it being cleared away. The brain says "do that again" very loudly.' },
      { title: 'Then the flat', text: 'With repeated floods the system turns itself down. The substance does less (tolerance), and so does everything else: food, friends, music. That flatness is a big part of why early recovery can feel joyless. It lifts, but not overnight.' },
      { title: 'Chasing the first time', text: 'Because the system is turned down, the first high can never be repeated. The chase is built into the chemistry; it is not a character flaw.' },
    ],
    checks: [
      { q: 'Why does ordinary life feel flat in early recovery?', options: [
        { t: 'Because life without the substance is boring', ok: false, why: 'It feels that way because the reward system was turned down by the floods. It recovers with time and with real activities.' },
        { t: 'Because the brain turned its reward system down after repeated floods', ok: true, why: 'Yes. The flatness is chemistry healing, not a verdict on your life.' } ] },
      { q: 'Can the first high be repeated?', options: [
        { t: 'Yes, with enough of it', ok: false, why: 'More only deepens the turn-down. The chase cannot be won.' },

  { id: 'm2-l2', title: 'Learned cues', minutes: 3,

    cards: [

    checks: [ { q: '"If I were strong enough I could keep alcohol in the house." Which is the smarter reading?', options: [

  { id: 'm2-l4', title: 'Treatment, medicines and healing', minutes: 4, clinicalReview: true,

<script data-part="engine.js">
/* ════════════════════════════════════════════════════════════════════════════════════════════
   1-addic · offline edition · ENGINE
   The pure rules engine (BUILD-PLAN 3.2, 3.7, 3.9-3.11). Every function takes data in and returns
   data out. `now` is always a parameter (an ISO string, a Date or ms): no clock inside a rule.
   No DOM, no storage, no network. Nothing derived ever decreases: XP, mastery, badges, total days
   and the Harbor's light come from the append-only event log; a slip restarts only the opt-in
   current run. The only randomness in this file is inside id().
   Classic script: the browser build concatenates it after the content files (Content is a
   shared top-level const); under Node, require('./engine.js') loads the content files itself.
   ════════════════════════════════════════════════════════════════════════════════════════════ */
const Engine = (() => {
  'use strict';

  /* Node only: content-core.js, then every other content-*.js in this folder, sorted. */
  function loadContentNode() {
    if (typeof require !== 'function') return {};
    const fs = require('fs');
    const path = require('path');
    const core = require(path.join(__dirname, 'content-core.js'));
    const extra = fs.readdirSync(__dirname).filter((f) => /^content-.*\.js$/.test(f) && f !== 'content-core.js').sort();
    for (const f of extra) require(path.join(__dirname, f));
    return core;
  }
  const C = (typeof Content !== 'undefined') ? Content : loadContentNode();

  const DAY_MS = 86400000;
  const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k);
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const arr = (x) => (Array.isArray(x) ? x : []);

  /* ── ids and dates ───────────────────────────────────────────────────────────────────────── */

  let lastT = 0;
  let seq = 0;
  function randomPart(len) {
    const abc = '0123456789abcdefghijklmnopqrstuvwxyz';
    let out = '';
    const g = (typeof globalThis !== 'undefined' && globalThis.crypto && typeof globalThis.crypto.getRandomValues === 'function') ? globalThis.crypto : null;
    if (g) {
      const buf = new Uint8Array(len);
      g.getRandomValues(buf);
      for (let i = 0; i < len; i++) out += abc[buf[i] % 36];
    } else {
      for (let i = 0; i < len; i++) out += abc[Math.floor(Math.random() * 36)];
    }
    return out;
  }
  /* Time-sortable (9 base-36 chars of ms, then a 3-char sequence within the ms) plus 6 random chars. */
  function id() {
    let t = Date.now();
    if (t <= lastT) { t = lastT; seq += 1; } else { lastT = t; seq = 0; }
    return t.toString(36).padStart(9, '0') + seq.toString(36).padStart(3, '0') + randomPart(6);
  }

  /* An ISO string, a Date, ms, or a plain 'YYYY-MM-DD' (local midnight) to a Date, or null. */
  function toDate(x) {
    if (x instanceof Date) return isNaN(x.getTime()) ? null : new Date(x.getTime());
    if (typeof x === 'number') return isFinite(x) ? new Date(x) : null;
    if (typeof x === 'string' && x) {
      const m = DATE_RE.exec(x);
      const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(x);
      return isNaN(d.getTime()) ? null : d;
    }
    return null;
  }
  const msOf = (x) => { const d = toDate(x); return d ? d.getTime() : NaN; };

  /* The device-local calendar date of x as 'YYYY-MM-DD' ('' when x is not a date). */
  function dateStr(x) {
    if (typeof x === 'string' && DATE_RE.test(x)) return x;
    const d = toDate(x);
    return d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
  }
  function todayStr(now) { return dateStr(now); }

  /* Calendar arithmetic on 'YYYY-MM-DD' parsed as UTC, so DST never shifts a day. */
  function utcMs(ds) {
    const m = DATE_RE.exec(dateStr(ds));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
  }
  function fromUtc(ms) {
    const d = new Date(ms);
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  function addDays(ds, n) {
    const t = utcMs(ds);
    if (isNaN(t)) return '';
    return fromUtc(t + Math.round(Number(n) || 0) * DAY_MS);
  }
  /* b minus a, in calendar days (0 when either is not a date). */
  function daysBetween(a, b) {
    const ta = utcMs(a);
    const tb = utcMs(b);
    if (isNaN(ta) || isNaN(tb)) return 0;
    return Math.round((tb - ta) / DAY_MS);
  }
  /* The first day of the week holding ds; weekStartsOn 1 = Monday (default), 0 = Sunday. */
  function weekStart(ds, weekStartsOn = 1) {
    const t = utcMs(ds);
    if (isNaN(t)) return '';
    const dow = new Date(t).getUTCDay();
    const first = ((Number(weekStartsOn) % 7) + 7) % 7;
    return addDays(fromUtc(t), -((dow - first + 7) % 7));
  }
  /* en-IN style, fixed so every device shows the same: "7 Nov 2026", "7:40 pm". */
  function fmtDate(x) {
    const d = toDate(x);
    return d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '';
  }
  function fmtTime(x) {
    const d = toDate(x);
    if (!d) return '';
    const h = d.getHours();
    return `${h % 12 || 12}:${pad(d.getMinutes())} ${h < 12 ? 'am' : 'pm'}`;
  }
  function fmtDateTime(x) {
    const d = toDate(x);
    return d ? `${fmtDate(d)}, ${fmtTime(d)}` : '';
  }
  function hourOf(iso) {
    const d = toDate(iso);
    return d ? d.getHours() : 0;
  }
  /* Night is 20:00 to 05:59 local time. */
  function isNight(now) {
    const d = toDate(now);
    if (!d) return false;
    const h = d.getHours();
    return h >= 20 || h < 6;
  }

  /* ── profile ─────────────────────────────────────────────────────────────────────────────── */

  function term(profile) {
    const terms = arr(C.terms);
    const want = profile && profile.term;
    const row = terms.find((t) => t.id === want) || terms[0] || { word: 'sober', days: 'sober days', adjective: 'sober' };
    return { word: row.word, days: row.days, adjective: row.adjective };
  }
  function greeting(now, name) {
    const d = toDate(now);
    const h = d ? d.getHours() : 12;
    const base = (h >= 5 && h < 12) ? 'Good morning' : (h >= 12 && h < 17) ? 'Good afternoon' : (h >= 17) ? 'Good evening' : 'Hello';
    const n = typeof name === 'string' ? name.trim() : '';
    return n ? `${base}, ${n}.` : `${base}.`;
  }
  function companionName(profile) {
    const n = profile && typeof profile.companion === 'string' ? profile.companion.trim() : '';
    return n ? n.slice(0, 40) : 'Companion';
  }

  /* ── events ──────────────────────────────────────────────────────────────────────────────── */

  /* Valid events (a type and a parseable at), sorted by at then id, each id counted once. Rows and events marked
     sample: true are skipped by every derivation (CORE ruling 10:45): sample data never awards or lowers anything. */
  function cmpStr(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function normEvents(events) {
    const list = Array.isArray(events) ? events : (events && typeof events.list === 'function') ? arr(events.list('events')) : [];
    const rows = list.filter((e) => e && e.sample !== true && typeof e.type === 'string' && !isNaN(msOf(e.at)));
    rows.sort((a, b) => (msOf(a.at) - msOf(b.at)) || cmpStr(String(a.id || ''), String(b.id || ''))
      || cmpStr(a.type, b.type) || cmpStr(JSON.stringify(a.payload || {}), JSON.stringify(b.payload || {})));
    const seen = new Set();
    const out = [];
    for (const e of rows) {
      if (e.id != null && e.id !== '') {
        if (seen.has(e.id)) continue;
        seen.add(e.id);
      }
      out.push(e);
    }
    return out;
  }
  const pl = (e) => (e && e.payload && typeof e.payload === 'object') ? e.payload : {};

  /* ── game: XP (numbers from Content.xp only) ─────────────────────────────────────────────── */

  const XP_SETTINGS = new Set(['mindfulDailyCap', 'repeatFull', 'repeatHalf', 'onceOnly']);
  const DIMINISHING = new Set(['LogCreated', 'CheckinCompleted', 'SkillUsed', 'ActivityDone']);
  const ONCE_FIELD = { LessonCompleted: 'lessonId', TutorialCompleted: 'id', CheckpointCompleted: 'moduleId', ExplorerCompleted: null };
  const ARTIFACT_KINDS = new Set(['build', 'assess', 'plan']);
  const KNOWN_KINDS = new Set(['build', 'assess', 'plan', 'practice', 'reflect', 'tool']);

  /* The XP an event type is worth before any limit; 0 for zero-XP, unknown and settings keys. */
  function xpBase(type) {
    const xp = C.xp || {};
    if (XP_SETTINGS.has(type) || !own(xp, type)) return 0;
    const v = xp[type];
    return (typeof v === 'number' && v > 0) ? v : 0;
  }
  function onceKey(e) {
    const field = own(ONCE_FIELD, e.type) ? ONCE_FIELD[e.type] : 'id';
    return field ? String(pl(e)[field] == null ? '' : pl(e)[field]) : '';
  }
  /* byType lists XP-bearing types only, so a zero-XP event (a slip) never changes the shape. */
  function xpFromEvents(events, now) {
    const xp = C.xp || {};
    const full = Number(xp.repeatFull) || 0;
    const half = Number(xp.repeatHalf) || 0;
    const cap = Number(xp.mindfulDailyCap) || 0;
    const once = new Set(arr(xp.onceOnly));
    const today = todayStr(now);
    const counts = new Map();
    const done = new Set();
    let total = 0;
    let todayXp = 0;
    const byType = {};
    for (const e of normEvents(events)) {
      const base = xpBase(e.type);
      const day = dateStr(e.at);
      let got = 0;
      if (base > 0) {
        if (DIMINISHING.has(e.type)) {
          const k = `${e.type}|${day}`;
          const n = (counts.get(k) || 0) + 1;
          counts.set(k, n);
          got = n <= full ? base : n <= half ? Math.floor(base / 2) : 0;
        } else if (e.type === 'MindfulMinute') {
          const k = `MindfulMinute|${day}`;
          const so = counts.get(k) || 0;
          got = Math.max(0, Math.min(base, cap - so));
          counts.set(k, so + got);
        } else if (once.has(e.type) || own(ONCE_FIELD, e.type)) {
          const k = `${e.type}|${onceKey(e)}`;
          if (!done.has(k)) { done.add(k); got = base; }
        } else if (e.type === 'ArtifactSaved') {
          const p = pl(e);
          const kind = KNOWN_KINDS.has(p.kind) ? p.kind : 'build';
          const k = `ArtifactSaved|${p.exerciseId == null ? '' : p.exerciseId}|${day}`;
          if (ARTIFACT_KINDS.has(kind) && !done.has(k)) { done.add(k); got = base; }
        } else {
          got = base;
        }
      }
      if (base > 0) byType[e.type] = (byType[e.type] || 0) + got;
      total += got;
      if (day === today) todayXp += got;
    }
    return { total, today: todayXp, byType };
  }

  /* ── game: mastery, regions, momentum ────────────────────────────────────────────────────── */
