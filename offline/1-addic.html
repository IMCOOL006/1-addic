  function comebackRows(view) {
    return history(view, 'trial').map((r) => {
      const p = payloadOf(r);
      const response = strOf(p.comeback) || strOf(p.closing) || strOf(p.verdict) || strOf(p.response) || strOf(p.reply);
      return { thought: strOf(p.thought), response, at: r.at };
    }).filter((c) => c.response);
  }
  function comebacks(view) { return uniq(comebackRows(view).map((c) => c.response)); }
  /* The person's own distractions, else the catalog's. */
  function distractionDeck(view) {
    const r = latest(view, 'distractions');
    let own = pickTexts(r && r.payload, ['distractions', 'deck', 'picks', 'items', 'own', 'custom']);
    if (!own.length && r) own = allTexts(r.payload);
    return own.length ? own : uniq(textsOf(C.catalogs && C.catalogs.distractions));
  }
  /* The person's spiral thoughts with their replies; a missing reply takes a slip self-talk line. */
  function spiralThoughts(view) {
    const p = payloadOf(latest(view, 'spiral'));
    const replies = textsOf(C.catalogs && C.catalogs.slipSelfTalk);
    let pairs = arr(p.pairs).map((x) => (typeof x === 'string' ? { thought: x.trim(), reply: '' }
      : { thought: strOf(x && x.thought), reply: strOf(x && (x.reply || x.rebuttal || x.answer)) }));
    if (!pairs.length) {
      const own = arr(p.replies);
      pairs = pickTexts(p, ['thoughts', 'items', 'checked', 'picks']).map((t, i) => ({ thought: t, reply: strOf(own[i]) }));
    }
    return pairs.filter((x) => x.thought).map((x, i) => ({ thought: x.thought, reply: x.reply || replies[i % (replies.length || 1)] || '' }));
  }
  /* Trigger chips: the catalog plus the person's own, flagged from the latest `triggers` response
     (experienced = mine, frequent = starred, anger = tagged); frequent first, then mine, then the rest. */
  function triggerChips(view) {
    const cat = (C.catalogs && C.catalogs.triggers) || {};
    const chips = [];
    const byKey = new Map();
    const add = (kind, label) => {
      const l = strOf(label);
      if (!l) return null;
      const key = kind + ':' + slug(l);
      if (!byKey.has(key)) { const c = { id: key, label: l, kind, frequent: false, anger: false, mine: false }; byKey.set(key, c); chips.push(c); }
      return byKey.get(key);
    };
    for (const kind of Object.keys(cat)) for (const l of textsOf(cat[kind])) add(kind, l);
    const p = payloadOf(latest(view, 'triggers'));
    const lists = { frequent: new Set(pickTexts(p, ['frequent', 'starred']).map((s) => s.toLowerCase())), anger: new Set(pickTexts(p, ['anger', 'angerTriggers']).map((s) => s.toLowerCase())) };
    const mark = (c, x) => {
      if (!c) return;
      c.mine = true;
      if ((x && x.frequent === true) || lists.frequent.has(c.label.toLowerCase())) c.frequent = true;
      if ((x && x.anger === true) || lists.anger.has(c.label.toLowerCase())) c.anger = true;
    };
    for (const x of arr(p.items)) if (x && typeof x === 'object') mark(add(strOf(x.kind) || 'custom', x.label || x.text), x);
    for (const kind of Object.keys(cat).concat(['custom'])) for (const x of arr(p[kind])) mark(add(kind, typeof x === 'string' ? x : x && (x.label || x.text)), typeof x === 'object' ? x : null);
    for (const c of chips) if (!c.mine && (c.frequent || c.anger)) c.mine = true;
    const rank = (c) => (c.frequent ? 0 : c.mine ? 1 : 2);
    return chips.map((c, i) => [c, i]).sort((a, b) => (rank(a[0]) - rank(b[0])) || (a[1] - b[1])).map((x) => x[0]);
  }

  /* ── skill ranking (shared by the plan prefill and U-07 insights): mean helpful x ln(uses+1);
     a skill never rated counts as 0.5 (neutral) so a used skill is not dropped for lack of a rating */
  function rankSkills(view) {
    const m = mastery(view);
    return Object.keys(m).map((sid) => {
      const s = arr(C.skills).find((x) => x.id === sid) || {};
      const h = m[sid].helpfulAvg === null ? 0.5 : m[sid].helpfulAvg;
      return { skillId: sid, name: s.name || sid, kind: s.kind || null, region: s.region || null, uses: m[sid].uses, helpfulAvg: m[sid].helpfulAvg,
        score: Math.round(h * Math.log(m[sid].uses + 1) * 1000) / 1000 };
    }).sort((a, b) => (b.score - a.score) || (b.uses - a.uses) || cmpStr(a.skillId, b.skillId));
  }
  /* Trigger ids counted over craving logs, most frequent first (ties by first seen). */
  function triggerCounts(view) {
    const counts = new Map();
    for (const l of logsOf(view)) if (l.type === 'craving') for (const t of arr(l.triggerIds)) if (typeof t === 'string' && t) counts.set(t, (counts.get(t) || 0) + 1);
    return [...counts.entries()].map(([tid, count], i) => ({ id: tid, count, i })).sort((a, b) => (b.count - a.count) || (a.i - b.i)).map(({ id: tid, count }) => ({ id: tid, count }));
  }
  function chipLabel(chips, tid) {
    const c = chips.find((x) => x.id === tid);
    return c ? c.label : String(tid).replace(/^[a-z]+:/, '').replace(/-/g, ' ');
  }

  /* ── tips (3.11): one a day, Today only, never on an SOS route, switchable, none repeated
     within 14 days; the first rule that holds, in content order ──────────────────────────── */

  const TIP_RULES = {
    /* a red-flag craving log in the last 14 days and no trial response since it */
    redFlagLogNoTrial: (x) => {
      const flagged = x.logs.filter((l) => l.type === 'craving' && (l.redFlag || strOf(l.thought)) && l.date >= x.minus(13));
      if (!flagged.length) return false;
      const last = flagged[flagged.length - 1];
      return !responsesFor(x.view, 'trial').some((r) => msOf(r.at) >= msOf(last.at));
    },
    /* 3 or more craving logs from 18:00 in the last 14 days and nothing planned for today */
    eveningCravings: (x) => x.logs.filter((l) => l.type === 'craving' && l.hour >= 18 && l.date >= x.minus(13)).length >= 3
      && !rowsOf(x.view, 'plans').some((p) => p.date === x.today),
    /* fewer than 3 reasons on the Reasons Card */
    thinReasons: (x) => reasonsCard(x.view).length < 3,
    /* exactly one active Safety Net */
    oneSafetyNet: (x) => safetyNets(x.view, true).length === 1,
    /* no practice (ExerciseDone of kind practice, or MindfulMinute) in the last 7 days */
    noPractice: (x) => !x.ev.some((e) => (e.type === 'MindfulMinute' || (e.type === 'ExerciseDone' && pl(e).kind === 'practice')) && dateStr(e.at) >= x.minus(6)),
    /* 10 or more rows worth keeping and no backup in the last 30 days */
    noBackup: (x) => (x.ev.length + x.logs.length) >= 10 && (!x.settings.lastBackupAt || isNaN(msOf(x.settings.lastBackupAt)) || dateStr(x.settings.lastBackupAt) < x.minus(29)),
    /* fewer than 3 days of momentum, for someone who has started (at least one event) */
    lowMomentum: (x) => x.ev.length > 0 && momentum(x.ev, x.now).days < 3,
    /* no want-to planned for today or the next 6 days */
    noWantTo: (x) => !rowsOf(x.view, 'plans').some((p) => p.kind === 'want' && p.date >= x.today && p.date <= addDays(x.today, 6)),
    /* today is the review day and no Weekly Review in the last 6 days */
    reviewDue: (x) => weekday(x.today) === (Number.isInteger(x.profile.reviewDay) ? x.profile.reviewDay : 0)
      && !x.ev.some((e) => e.type === 'WeeklyReviewCompleted' && dateStr(e.at) >= x.minus(6)),
  };
  function pickTip(view, now, ctx) {
    const route = ctx && typeof ctx.route === 'string' ? ctx.route : '';
    if (route.startsWith('#/sos')) return null;
    const settings = rowOf(view, 'settings', 'app') || {};
    const today = todayStr(now);
    if (settings.tips === false || settings.lastTipDay === today) return null;
    const shown = rowsOf(view, 'tips').filter((t) => !isNaN(msOf(t.shownAt)));
    if (shown.some((t) => dateStr(t.shownAt) === today)) return null;
    const recent = new Set(shown.filter((t) => daysBetween(dateStr(t.shownAt), today) < 14).map((t) => t.id));
    const x = { view, now, today, settings, profile: rowOf(view, 'profile', 'me') || {}, ev: normEvents(view), logs: logsOf(view), minus: (k) => addDays(today, -k) };
    for (const tip of arr(C.tips)) {
      if (recent.has(tip.id) || !own(TIP_RULES, tip.when)) continue;
      if (TIP_RULES[tip.when](x) === true) return Object.assign({}, tip);
    }
    return null;
  }

  /* ── My Recovery Plan prefill (3.10): nine sections, each a list of strings, unconfirmed ─── */

  const ROLE_WORD = { safetyNet: 'Safety Net', sponsor: 'sponsor', therapist: 'therapist' };
  function prefillRecoveryPlan(view, now) {
    const sec = (items) => ({ items: uniq(items.filter((s) => typeof s === 'string' && s.trim()).map((s) => s.trim())), confirmed: false });
    const ranked = rankSkills(view).filter((s) => s.score > 0);
    const topKind = (kind, n) => ranked.filter((s) => s.kind === kind).slice(0, n).map((s) => s.name);
    const mot = rowsOf(view, 'motivation').filter((r) => !isNaN(msOf(r.at))).sort(byAt);
    const lastPlus = [...mot].reverse().map((r) => strOf(r.plusOne)).find(Boolean);
    const people = rowsOf(view, 'contacts').filter((c) => c.active !== false && own(ROLE_WORD, c.role) && strOf(c.name))
      .map((c) => `${strOf(c.name)} (${ROLE_WORD[c.role]})`);
    const chips = triggerChips(view);
    const triggers = chips.filter((c) => c.frequent).map((c) => c.label).concat(triggerCounts(view).slice(0, 5).map((t) => chipLabel(chips, t.id)));
    const ws = payloadOf(latest(view, 'warning-signs'));
    const signs = arr(C.catalogs && C.catalogs.warningSigns);
    const warnings = arr(ws.top || ws.picks || ws.topN).slice(0, 3).map((x) => {
      const sid = typeof x === 'string' ? x : x && (x.id || x.sign || x.signId);
      const label = (signs.find((s) => s.id === sid) || {}).label || strOf(x && x.label) || strOf(sid);
      const plan = strOf(x && x.plan);
      return label ? (plan ? `${label}: ${plan}` : label) : '';
    });
    const risky = new Map();
    for (const pi of rowsOf(view, 'plans').filter((p) => p.battlePlan && typeof p.battlePlan === 'object')) {
      const situation = strOf(pi.battlePlan.situation) || strOf(pi.title);
      if (!situation) continue;
      const k = situation.toLowerCase();
      const cur = risky.get(k) || { situation, plan: '', count: 0, date: '' };
      cur.count += 1;
      if (String(pi.date || '') >= cur.date) { cur.date = String(pi.date || ''); cur.plan = strOf(pi.battlePlan.plan) || cur.plan; }
      risky.set(k, cur);
    }
    const battlePlans = [...risky.values()].sort((a, b) => (b.count - a.count) || cmpStr(b.date, a.date)).map((r) => (r.plan ? `${r.situation}: ${r.plan}` : r.situation));
    const support = pickTexts(payloadOf(latest(view, 'slip-review')), ['support']).concat(pickTexts(payloadOf(latest(view, 'expand-network')), ['support']));
    return {
      motivation: sec(reasonsCard(view).concat(lastPlus ? [lastPlus] : [])),
      wellness: sec(topKind('wellness', 6)),
      situation: sec(topKind('situation', 6)),
      people: sec(people),
      mood: sec(topKind('mood', 3)),
      triggers: sec(triggers),
      warnings: sec(warnings),
      battlePlans: sec(battlePlans),
      support: sec(support),
    };
  }

  /* ── insights (3.9): ready at 7 logs (craving + feeling + check-in); under 14 every card carries
     a small-sample caveat. heatmap[weekday 0 = Sunday .. 6][hour 0..23] = {count, mean|null}. ──── */

  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const num = (x) => (typeof x === 'number' && isFinite(x) ? x : null);
  const mean = (list) => { const xs = list.filter((x) => num(x) !== null); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
  const r1 = (x) => (x === null ? null : Math.round(x * 10) / 10);
  const INSIGHT_TYPES = new Set(['craving', 'feeling', 'checkin']);
  const INSIGHTS_READY = 7; // logs before Insights show
  const INSIGHTS_SOLID = 14; // under this, each card says the sample is small

  function heatmapOf(logs) {
    const grid = Array.from({ length: 7 }, () => Array.from({ length: 24 }, () => ({ count: 0, sum: 0, n: 0 })));
    for (const l of logs) {
      if (l.type !== 'craving') continue;
      const c = grid[weekday(l.date)][l.hour];
      c.count += 1;
      if (num(l.intensity) !== null) { c.sum += l.intensity; c.n += 1; }
    }
    return grid.map((row) => row.map((c) => ({ count: c.count, mean: c.n ? r1(c.sum / c.n) : null })));
  }
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const pleasantWord = (n) => `${n} pleasant ${n === 1 ? 'activity' : 'activities'}`;
  /* Evening check-ins, the last one of each date, compared by pleasant activities (>= 1 against 0).
     Plain sentences about what went together; never a claim about cause. */
  function moodVsActivities(view) {
    const byDate = new Map();
    for (const l of eveningCheckins(view)) byDate.set(l.date, checkinOf(l));
    const days = [...byDate.values()].filter((c) => Number.isInteger(c.pleasantCount));
    const group = (list) => ({ days: list.length, mood: r1(mean(list.map((c) => c.mood))), craving: r1(mean(list.map((c) => c.peakCraving))) });
    const withActivity = group(days.filter((c) => c.pleasantCount >= 1));
    const withoutActivity = group(days.filter((c) => c.pleasantCount === 0));
    const said = (g, lead) => {
      if (!g.days) return null;
      const parts = [];
      if (g.mood !== null) parts.push(`your mood averaged ${g.mood}/10`);
      if (g.craving !== null) parts.push(`your peak craving ${g.craving}/10`);
      return parts.length ? `${lead}, ${parts.join(' and ')}.` : null;
    };
    const sentences = [
      said(withActivity, `On ${plural(withActivity.days, 'day')} with at least one pleasant activity`),
      said(withoutActivity, `On ${plural(withoutActivity.days, 'day')} with none`),
    ].filter(Boolean);
    if (withActivity.days && withoutActivity.days && sentences.length) sentences.push('This shows what went together in your check-ins, not what caused what.');
    return { withActivity, withoutActivity, sentences };
  }
  function predictionsSummary(view) {
    const done = rowsOf(view, 'predictions').filter((p) => num(p.predicted) !== null && num(p.actual) !== null);
    return { count: done.length, predicted: r1(mean(done.map((p) => p.predicted))), actual: r1(mean(done.map((p) => p.actual))), better: done.filter((p) => p.actual > p.predicted).length };
  }
  function motivationHistory(view) {
    return rowsOf(view, 'motivation').filter((r) => !isNaN(msOf(r.at))).sort(byAt)
      .map((r) => ({ id: r.id, at: r.at, date: dateStr(r.at), score: num(r.score), stage: r.stage || null, plusOne: strOf(r.plusOne) || null }));
  }
  function insights(view, now) {
    const today = todayStr(now);
    const logs = logsOf(view);
    const count = logs.filter((l) => INSIGHT_TYPES.has(l.type)).length;
    const cravings = logs.filter((l) => l.type === 'craving');
    const thisWeek = weekStart(today, 1);
    const cravingTrend = [];
    for (let w = 7; w >= 0; w -= 1) {
      const start = addDays(thisWeek, -7 * w);
      const end = addDays(start, 6);
      const inWeek = cravings.filter((l) => l.date >= start && l.date <= end);
      cravingTrend.push({ weekStart: start, count: inWeek.length, mean: r1(mean(inWeek.map((l) => l.intensity))) });
    }
    const chips = triggerChips(view);
    return {
      ready: count >= INSIGHTS_READY,
      count,
      cravingTrend,
      topTriggers: triggerCounts(view).slice(0, 5).map((t) => ({ id: t.id, label: chipLabel(chips, t.id), count: t.count })),
      heatmap: heatmapOf(logs),
      moodVsActivities: moodVsActivities(view),
      skillRanking: rankSkills(view).filter((s) => s.uses > 0).slice(0, 8),
      predictions: predictionsSummary(view),
      motivationHistory: motivationHistory(view),
      caveat: count < INSIGHTS_SOLID ? `Based on ${plural(count, 'log')}. That is a small sample, so read these lightly.` : null,
    };
  }

  /* ── Warning Sign Radar (3.9): six detectors, gentle wording, never red. Each sign maps to a
     Content.catalogs.warningSigns id; the person's own plan (their warning-signs top 3) wins over
     the general suggestion. Thresholds:
       noMeeting        no meeting in the last 14 days, >= 2 meeting dates in the 28 before
       fewPleasant      < 2 pleasant activities over the last 7 check-ins (7 needed, last 14 days)
       poorSleep        < 6 h sleep on 3 of the last 5 check-ins with sleep (last 14 days)
       noContact        an active supportive contact, no ContactReached in 14 days, data >= 14 days old
       weekendUnplanned this week's planner in use, a Fri/Sat/Sun evening from today on with no block
                        overlapping 18:00-23:00
       feelingsRising   mean feeling intensity of the last 7 days >= the 7 before + 2 (>= 2 logs each) ── */

  const POOR_SLEEP_HOURS = 6;
  const RADAR = [
    { signId: 'noMeeting', catalogId: 'groups-less', label: 'Fewer meetings lately', plan: 'Pick one meeting or group this week and put it in the planner.' },
    { signId: 'fewPleasant', catalogId: 'few-fun', label: 'Few enjoyable things lately', plan: 'Schedule one want-to for tomorrow, at your riskiest hour.' },
    { signId: 'poorSleep', catalogId: 'poor-sleep', label: 'Sleep has been short', plan: 'Plan a calm wind-down tonight. If it keeps up, mention it to a doctor.' },
    { signId: 'noContact', catalogId: 'isolating', label: 'Less contact with your people', plan: 'Send one short message to someone in your crew today.' },
    { signId: 'weekendUnplanned', catalogId: 'unstructured', label: 'Open weekend evenings', plan: 'Put one plan, or a Battle Plan, in each open evening.' },
    { signId: 'feelingsRising', catalogId: 'intense-emotions', label: 'Feelings running higher', plan: 'Try a feeling tool in SOS, and tell someone how this week has been.' },
  ];
  const SUPPORT_ROLES = new Set(['safetyNet', 'sponsor', 'therapist', 'other']);
  const toMin = (t) => { const m = /^(\d{2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };
  const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  function ownWarningPlans(view) {
    const ws = payloadOf(latest(view, 'warning-signs'));
    const plans = new Map();
    for (const x of arr(ws.top || ws.picks || ws.topN).slice(0, 3)) {
      const sid = typeof x === 'string' ? x : x && (x.id || x.sign || x.signId);
      if (typeof sid === 'string' && sid) plans.set(sid, strOf(x && x.plan));
    }
    return plans;
  }
  function planRows(view) { return rowsOf(view, 'plans').filter((p) => DATE_RE.test(String(p.date || '')) && p.status !== 'skipped'); }
  function warningSigns(view, now) {
    const today = todayStr(now);
    if (!today) return [];
    const from = (k) => addDays(today, -k);
    const logs = logsOf(view).filter((l) => l.date <= today);
    const ev = normEvents(view).filter((e) => dateStr(e.at) <= today);
    const fired = {};
    // noMeeting
    const meetDates = new Set(logs.filter((l) => (l.type === 'checkin' && checkinOf(l).meeting === true)
      || (l.type === 'activity' && l.activity && l.activity.kind === 'meeting')).map((l) => l.date));
    for (const e of ev) if (e.type === 'SkillUsed' && pl(e).skillId === 'meeting') meetDates.add(dateStr(e.at));
    const recentMeet = [...meetDates].filter((d) => d >= from(13)).length;
    const priorMeet = [...meetDates].filter((d) => d >= from(41) && d <= from(14)).length;
    if (!recentMeet && priorMeet >= 2) fired.noMeeting = `No meeting logged in the last 14 days. You logged ${plural(priorMeet, 'meeting day')} in the four weeks before.`;
    // fewPleasant and poorSleep: recent check-ins only
    const recentCheckins = logs.filter((l) => l.type === 'checkin' && l.date >= from(13)).map(checkinOf);
    const withPleasant = recentCheckins.filter((c) => Number.isInteger(c.pleasantCount)).slice(-7);
    const pleasant = withPleasant.reduce((a, c) => a + c.pleasantCount, 0);
    if (withPleasant.length >= 7 && pleasant < 2) fired.fewPleasant = `Your last 7 check-ins show ${pleasantWord(pleasant)}.`;
    const withSleep = recentCheckins.filter((c) => num(c.sleep) !== null).slice(-5);
    const short = withSleep.filter((c) => c.sleep < POOR_SLEEP_HOURS).length;
    if (withSleep.length >= 5 && short >= 3) fired.poorSleep = `Less than ${POOR_SLEEP_HOURS} hours of sleep on ${short} of your last 5 check-ins.`;
    // noContact
    const crew = rowsOf(view, 'contacts').filter((c) => c.active !== false && SUPPORT_ROLES.has(c.role));
    const firstDate = [...logs.map((l) => l.date), ...ev.map((e) => dateStr(e.at))].sort()[0];
    const reached = ev.some((e) => e.type === 'ContactReached' && dateStr(e.at) >= from(13));
    if (crew.length && !reached && firstDate && firstDate <= from(14)) fired.noContact = 'No contact with your crew marked in the last 14 days.';
    // weekendUnplanned
    const ws = weekStart(today, 1);
    const weekPlans = planRows(view).filter((p) => p.date >= ws && p.date <= addDays(ws, 6));
    if (weekPlans.length) {
      const open = [4, 5, 6].map((k) => addDays(ws, k)).filter((d) => d >= today)
        .filter((d) => !weekPlans.some((p) => p.date === d && toMin(p.start) < 23 * 60 && toMin(p.end) > 18 * 60));
      if (open.length) fired.weekendUnplanned = `Nothing planned yet for ${open.map((d) => `${WEEKDAYS[weekday(d)]} evening`).join(', ')}.`;
    }
    // feelingsRising
    const feel = logs.filter((l) => l.type === 'feeling' && num(l.intensity) !== null);
    const last7 = feel.filter((l) => l.date >= from(6)).map((l) => l.intensity);
    const prev7 = feel.filter((l) => l.date >= from(13) && l.date <= from(7)).map((l) => l.intensity);
    if (last7.length >= 2 && prev7.length >= 2 && mean(last7) - mean(prev7) >= 2) {
      fired.feelingsRising = `Your feeling logs average ${r1(mean(last7))}/10 this week, up from ${r1(mean(prev7))}/10 the week before.`;
    }
    const ownPlans = ownWarningPlans(view);
    return RADAR.filter((r) => own(fired, r.signId)).map((r) => {
      const mine = ownPlans.has(r.catalogId);
      return { signId: r.signId, label: r.label, evidence: fired[r.signId], plan: (mine && ownPlans.get(r.catalogId)) || r.plan, own: mine };
    });
  }

  /* ── planner (3.9): a day runs 07:00-23:00; a gap is an uncovered stretch of 2 h or more ──── */

  const DAY_START = 7 * 60;
  const DAY_END = 23 * 60;
  const GAP_MIN = 120;
  function gaps(planItems, ds) {
    const list = (planItems && typeof planItems.list === 'function') ? rowsOf(planItems, 'plans') : arr(planItems);
    const spans = list.filter((p) => p && p.sample !== true && p.date === ds && p.status !== 'skipped')
      .map((p) => [Math.max(DAY_START, toMin(p.start)), Math.min(DAY_END, toMin(p.end))])
      .filter(([s, e]) => !isNaN(s) && !isNaN(e) && e > s).sort((a, b) => a[0] - b[0]);
    const span = (a, b) => ({ start: hhmm(a), end: hhmm(b), hours: Math.round(((b - a) / 60) * 100) / 100 });
    const out = [];
    let cur = DAY_START;
    for (const [s, e] of spans) { if (s - cur >= GAP_MIN) out.push(span(cur, s)); cur = Math.max(cur, e); }
    if (DAY_END - cur >= GAP_MIN) out.push(span(cur, DAY_END));
    return out;
  }
  /* The hours with the most craving logs over all weekdays (ties: higher mean, then earlier hour). */
  function riskyHours(heatmap, n = 3) {
    const tot = Array.from({ length: 24 }, (_, h) => ({ h, count: 0, sum: 0, k: 0 }));
    for (const row of arr(heatmap)) {
      arr(row).slice(0, 24).forEach((c, h) => {
        const count = typeof c === 'number' ? c : (c && num(c.count)) || 0;
        if (count <= 0) return;
        tot[h].count += count;
        if (c && num(c.mean) !== null) { tot[h].sum += c.mean * count; tot[h].k += count; }
      });
    }
    const m = (t) => (t.k ? t.sum / t.k : 0);
    return tot.filter((t) => t.count > 0).sort((a, b) => (b.count - a.count) || (m(b) - m(a)) || (a.h - b.h)).slice(0, n).map((t) => t.h);
  }
  /* Want-tos: the person's activity-menu (or used-to-enjoy) list, else the Activity Library. */
  function wantTos(view) {
    const mine = pickTexts(payloadOf(latest(view, 'activity-menu')), ['wantTos', 'wantTo', 'want', 'activities', 'items'])
      .concat(pickTexts(payloadOf(latest(view, 'used-to-enjoy')), ['items', 'activities', 'enjoyed']));
    if (mine.length) return uniq(mine);
    return arr(C.catalogs && C.catalogs.activities).flatMap((g) => textsOf(g && g.items));
  }
  /* Up to three want-tos at the heatmap's top hours that fall inside an open gap of the day; the
     activity rotates by date (deterministic, never random). */
  function suggestions(view, ds) {
    if (!DATE_RE.test(String(ds || ''))) return [];
    const plans = planRows(view);
    const open = gaps(plans, ds);
    const hours = riskyHours(heatmapOf(logsOf(view)), 24).filter((h) => h * 60 >= DAY_START && (h + 1) * 60 <= DAY_END)
      .filter((h) => open.some((g) => toMin(g.start) <= h * 60 && (h + 1) * 60 <= toMin(g.end))).slice(0, 3);
    const planned = new Set(plans.filter((p) => p.date === ds).flatMap((p) => [strOf(p.title), strOf(p.activity)]).filter(Boolean).map((s) => s.toLowerCase()));
    const acts = wantTos(view).filter((a) => !planned.has(a.toLowerCase()));
    if (!acts.length) return [];
    const base = Math.abs(daysBetween('2000-01-03', ds));
    return hours.slice().sort((a, b) => a - b).map((hour, i) => ({ hour, activity: acts[(base + i) % acts.length] }));
  }

  /* ── Weekly Review (3.9, ADR 0021): the forecast check and a summary; no score, no XP ─────── */

  const partOfDay = (min) => (min < 12 * 60 ? 'morning' : min < 17 * 60 ? 'afternoon' : 'evening');
  function weekDates(ws) {
    const start = DATE_RE.test(String(ws || '')) ? ws : weekStart(dateStr(ws), 1);
    return start ? Array.from({ length: 7 }, (_, k) => addDays(start, k)) : [];
  }
  function forecastCheck(view, ws) {
    const dates = weekDates(ws);
    const plans = planRows(view);
    const logs = logsOf(view).filter((l) => l.type === 'craving' || l.type === 'feeling');
    return dates.map((date) => {
      const planned = plans.filter((p) => p.date === date && (p.risky === true || p.kind === 'risky' || (p.battlePlan && typeof p.battlePlan === 'object')))
        .sort((a, b) => (toMin(a.start) - toMin(b.start)) || cmpStr(String(a.id || ''), String(b.id || '')))
        .map((p) => ({ id: p.id, title: strOf(p.title), start: p.start || null, end: p.end || null, battlePlan: Boolean(p.battlePlan && typeof p.battlePlan === 'object') }));
      const logged = logs.filter((l) => l.date === date)
        .map((l) => ({ id: l.id, type: l.type, intensity: num(l.intensity), hour: l.hour, time: fmtTime(l.at) }));
      let line = null;
      if (planned.length) {
        const when = `${WEEKDAYS[weekday(date)]} ${isNaN(toMin(planned[0].start)) ? '' : partOfDay(toMin(planned[0].start))}`.trim();
        const top = logged.filter((l) => l.intensity !== null).sort((a, b) => (b.intensity - a.intensity) || (a.hour - b.hour))[0];
        if (top) line = `You planned for rough weather on ${when}; the log shows a ${top.intensity}/10 at ${top.time}${planned.some((p) => p.battlePlan) ? ', and your plan was there' : ''}.`;
        else if (!logged.length) line = `You planned for rough weather on ${when}; no craving or feeling was logged that day.`;
      }
      return { date, planned, logged, line };
    });
  }
  function weekSummary(view, ws) {
    const dates = weekDates(ws);
    if (!dates.length) return null;
    const inWeek = (d) => d >= dates[0] && d <= dates[6];
    const logs = logsOf(view).filter((l) => inWeek(l.date));
    const ev = normEvents(view).filter((e) => inWeek(dateStr(e.at)));
    const countType = (t) => logs.filter((l) => l.type === t).length;
    const counts = { craving: countType('craving'), feeling: countType('feeling'), checkin: countType('checkin'), activity: countType('activity') };
    const skillEv = ev.filter((e) => e.type === 'SkillUsed' && typeof pl(e).skillId === 'string');
    const helpedBy = new Map();
    for (const e of skillEv) if (helpfulValue(pl(e).helpful) === 1) helpedBy.set(pl(e).skillId, (helpedBy.get(pl(e).skillId) || 0) + 1);
    const skillName = (sid) => (arr(C.skills).find((s) => s.id === sid) || {}).name || sid;
    const topSkills = [...helpedBy.entries()].sort((a, b) => (b[1] - a[1]) || cmpStr(a[0], b[0])).slice(0, 3).map(([sid]) => skillName(sid));
    const pleasant = logs.filter((l) => l.type === 'checkin').reduce((a, l) => a + (Number.isInteger(checkinOf(l).pleasantCount) ? checkinOf(l).pleasantCount : 0), 0)
      + logs.filter((l) => l.type === 'activity' && l.activity && l.activity.kind === 'pleasant').length;
    const plans = planRows(view).filter((p) => inWeek(p.date));
    const sos = ev.filter((e) => e.type === 'SosCompleted');
    const passed = sos.filter((e) => sosOutcome(e) === 'passed').length;
    const logsTotal = counts.craving + counts.feeling + counts.checkin + counts.activity;
    const highlights = [
      logsTotal ? `You logged ${plural(logsTotal, 'time')} this week.` : null,
      skillEv.length ? `You used a skill ${plural(skillEv.length, 'time')}${topSkills.length ? `; ${topSkills[0]} helped most often` : ''}.` : null,
      pleasant ? `${pleasantWord(pleasant)} made it into your week.` : null,
      passed ? `You rode out ${plural(passed, 'craving')} with SOS.` : null,
      plans.some((p) => p.status === 'done') ? `You followed through on ${plural(plans.filter((p) => p.status === 'done').length, 'plan')}.` : null,
    ].filter(Boolean);
    return {
      weekStart: dates[0], end: dates[6], logs: counts,
      cravingMean: r1(mean(logs.filter((l) => l.type === 'craving').map((l) => l.intensity))),
      skillsUsed: skillEv.length, topSkills, pleasant,
      plans: { total: plans.length, done: plans.filter((p) => p.status === 'done').length, debriefed: plans.filter((p) => p.debrief && typeof p.debrief === 'object').length },
      sos: { sessions: sos.length, passed },
      highlights,
    };
  }

  /* ── SOS (3.9): the guide's tool order and the typed-text crisis check ─────────────────────── */

  /* The craving tools of ui-sos and the skill each one credits. 'wave' (Ride the wave, with SOBER
     breathing) always opens the guide; the other two places go to the tools rated most helpful
     (a tool never rated counts as 0.5), ties in this default order. Never empty. */
  const SOS_TOOLS = Object.freeze([
    { id: 'wave', skillId: 'ride-wave' }, { id: 'why', skillId: 'reasons' }, { id: 'distract', skillId: 'distract' },
    { id: 'call', skillId: 'call' }, { id: 'talkback', skillId: 'talk-back' },
  ].map((t) => Object.freeze(t)));
  const GUIDE_LEN = 3;
  function guideSequence(view) {
    const m = mastery(view);
    const score = (t) => (m[t.skillId] && m[t.skillId].helpfulAvg !== null ? m[t.skillId].helpfulAvg : 0.5);
    const rest = SOS_TOOLS.slice(1).map((t, i) => ({ id: t.id, i, s: score(t) })).sort((a, b) => (b.s - a.s) || (a.i - b.i)).map((x) => x.id);
    return ['wave'].concat(rest.slice(0, GUIDE_LEN - 1));
  }

  /* clinicalReview: true. Typed-text crisis phrases (RS2 and RS10 of contracts/actions-sos.md):
     matched case-insensitively after curly quotes become straight and spaces collapse; an apostrophe
     may be missing. It errs toward showing the urgent numbers: a false alarm is allowed, a miss is not. */
  const CRISIS_PATTERNS = [
    'suicid\\w*',
    'kill(?:s|ed|ing)? my ?self', 'kill me', 'kms',
    'self[- ]?harm\\w*',
    '(?:hurt(?:s|ing)?|harm(?:s|ed|ing)?|cut(?:s|ting)?|hang(?:s|ing)?|injur(?:e|es|ed|ing)) my ?self',
    'overdos(?:e|ed|ing) on purpose',
    '(?:want(?:s|ed|ing)?|going|ready|wish(?:ed)?) to die', 'wanna die',
    'wish i (?:was|were) dead', 'better off dead', 'better off without me',
    "(?:do not|don'?t|doesn'?t|not|never) (?:want|wanna)(?: to)? (?:live|be here|be alive|wake up|exist)",
    "(?:can'?t|cannot|can not) go on",
    'end(?:s|ed|ing)? (?:it all|it|things|my life|everything)',
    'tak(?:e|es|ing) my (?:own )?life',
    'nothing to live for',
    'no (?:reason|point)(?: (?:to|in|for))? (?:live|living|go on|going on)',
    "(?:not|isn'?t) worth living",
    'never wake up',
    '(?:think(?:s|ing)?|thought(?:s)?) (?:about|of) (?:death|dying|suicide|killing my ?self|ending it|ending my life)',
  ];
  const CRISIS_RE = new RegExp('\\b(?:' + CRISIS_PATTERNS.join('|') + ')\\b', 'gi');
  /* The crisis phrases found in text (lower case, each once, in order), or [] (non-strings too). */
  function crisisKeywords(text) {
    if (typeof text !== 'string' || !text.trim()) return [];
    const s = text.replace(/[‘’‛ʼ`´]/g, "'").replace(/\s+/g, ' ').toLowerCase();
    const out = [];
    for (const m of s.matchAll(CRISIS_RE)) if (!out.includes(m[0])) out.push(m[0]);
    return out;
  }

  /* ── data: backup, import, migrate and the calendar file (BUILD-PLAN 3.2, 3.3) ─────────────── */

  /* An error with a code, callable with or without `new`. */
  function AppError(message, code) {
    if (!(this instanceof AppError)) return new AppError(message, code);
    const e = new Error(String(message == null ? '' : message));
    this.name = 'AppError';
    this.message = e.message;
    this.code = code == null ? 'error' : String(code);
    this.stack = e.stack;
  }
  AppError.prototype = Object.create(Error.prototype, { constructor: { value: AppError, writable: true, configurable: true } });

  const APP = '1-addic';
  const schemaNow = () => (Number.isInteger(C.schemaVersion) && C.schemaVersion > 0 ? C.schemaVersion : 1);
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x) && !(x instanceof Date);
  const cloneJson = (x) => JSON.parse(JSON.stringify(x));
  const isLockRow = (store, row) => store === 'meta' && isObj(row) && row.key === 'lock';
  const errText = (e) => String((e && e.message) || e).replace(/\s+/g, ' ').slice(0, 200);

  /* meta: {exportedAt} or {now}, or the moment itself (ISO, Date, ms). No clock here. */
  function exportedAtOf(meta) {
    const m = isObj(meta) ? (meta.exportedAt != null ? meta.exportedAt : meta.now) : meta;
    const d = toDate(m);
    return d ? d.toISOString() : null;
  }
  /* Every store, in the view's own order, as plain JSON. The meta `lock` row never leaves; the
     `sample` row does, so sample data stays marked and erasable after an import. */
  function exportBackup(view, meta) {
    const stores = {};
    for (const s of Object.keys(STORES)) {
      const rows = arr(view && typeof view.list === 'function' ? view.list(s) : []);
      stores[s] = cloneJson(rows.filter((r) => isObj(r) && !isLockRow(s, r)));
    }
    return { app: APP, schemaVersion: schemaNow(), exportedAt: exportedAtOf(meta), stores };
  }

  const MAX_BACKUP_ERRORS = 20;
  const okKey = (k) => (typeof k === 'string' && k.length > 0) || (typeof k === 'number' && isFinite(k));
  /* {ok, errors[]}; never throws. Plain-language errors a person can read. */
  function validateBackup(obj) {
    const errors = [];
    const add = (m) => { if (errors.length < MAX_BACKUP_ERRORS) errors.push(m); };
    try {
      if (!isObj(obj)) return { ok: false, errors: ['This is not a 1-addic backup: the file is not a JSON object.'] };
      if (obj.app !== APP) add(`This is not a 1-addic backup: app is ${JSON.stringify(obj.app === undefined ? null : obj.app)}.`);
      const v = obj.schemaVersion;
      if (!Number.isInteger(v) || v < 1) add('The backup has no valid schemaVersion.');
      else if (v > schemaNow()) add(`This backup comes from a newer version of 1-addic (schema ${v}; this copy reads up to ${schemaNow()}).`);
      if (!isObj(obj.stores)) {
        add('The backup has no stores.');
      } else {
        for (const s of Object.keys(STORES)) {
          if (!own(obj.stores, s)) continue;
          const rows = obj.stores[s];
          if (!Array.isArray(rows)) { add(`stores.${s} is not a list.`); continue; }
          const kp = STORES[s];
          const seen = new Set();
          rows.forEach((r, i) => {
            if (!isObj(r)) { add(`stores.${s}[${i}] is not a row.`); return; }
            if (!okKey(r[kp])) add(`stores.${s}[${i}] has no ${kp}.`);
            else if (seen.has(r[kp])) add(`stores.${s} has the ${kp} ${JSON.stringify(r[kp])} twice.`);
            else seen.add(r[kp]);
            if (s === 'events') {
              if (typeof r.type !== 'string' || !r.type) add(`stores.events[${i}] has no type.`);
              if (!isFinite(msOf(r.at))) add(`stores.events[${i}] has no valid time (at).`);
            }
          });
        }
      }
    } catch (e) {
      add('The backup could not be read: ' + errText(e));
    }
    return { ok: errors.length === 0, errors };
  }

  /* Steps from an older schema to the next, keyed by the version they start from. None yet. */
  const MIGRATIONS = {};
  /* A migrated copy: every store present ([] when missing), unknown stores and any lock row
     dropped, schemaVersion brought up to date. null for a non-object. Run validateBackup first. */
  function migrateBackup(obj) {
    if (!isObj(obj)) return null;
    let out;
    try { out = cloneJson(obj); } catch (e) { return null; }
    const src = isObj(out.stores) ? out.stores : {};
    const stores = {};
    for (const s of Object.keys(STORES)) stores[s] = arr(src[s]).filter((r) => !isLockRow(s, r));
    out.stores = stores;
    let v = Number.isInteger(out.schemaVersion) && out.schemaVersion > 0 ? out.schemaVersion : 1;
    while (v < schemaNow()) {
      if (typeof MIGRATIONS[v] === 'function') out = MIGRATIONS[v](out) || out;
      v += 1;
    }
    if (!(Number.isInteger(out.schemaVersion) && out.schemaVersion > schemaNow())) out.schemaVersion = schemaNow();
    if (out.app === undefined) out.app = APP;

  }

  /* .ics (RFC 5545): CRLF lines folded at 75 octets, escaped text, floating local times. */
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const utf8Len = (ch) => { const c = ch.codePointAt(0); return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4; };
  function icsText(s) {
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r\n|\r|\n/g, '\\n');
  }
  function icsFold(line) {
    const out = [];
    let cur = '';
    let bytes = 0;
    for (const ch of line) {
      const b = utf8Len(ch);
      if (bytes + b > 75) { out.push(cur); cur = ' '; bytes = 1; }
      cur += ch;
      bytes += b;
    }
    out.push(cur);
    return out.join('\r\n');
  }
  const icsDay = (ds) => ds.replace(/-/g, '');
  const icsUtc = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  /* 'FREQ=WEEKLY;BYDAY=SU' for a 0-6 weekday (0 = Sunday, as profile.reviewDay), or null. */
  function weeklyRrule(day) { return Number.isInteger(day) && day >= 0 && day <= 6 ? `FREQ=WEEKLY;BYDAY=${BYDAY[day]}` : null; }
  /* An rrule given as 'FREQ=...' (an 'RRULE:' prefix is allowed) or {freq, byDay: 0-6 | 'MO'}. */
  function rruleOf(r) {
    if (typeof r === 'string') {
      const s = r.replace(/^RRULE:/i, '').trim().toUpperCase();
      return /^FREQ=(?:SECONDLY|MINUTELY|HOURLY|DAILY|WEEKLY|MONTHLY|YEARLY)(?:;[A-Z]+=[A-Z0-9,+-]+)*$/.test(s) ? s : null;
    }
    if (!isObj(r)) return null;
    const freq = String(r.freq || 'WEEKLY').toUpperCase();
    if (!/^(?:DAILY|WEEKLY|MONTHLY|YEARLY)$/.test(freq)) return null;
    let s = `FREQ=${freq}`;
    const d = typeof r.byDay === 'number' ? BYDAY[r.byDay] : (typeof r.byDay === 'string' ? r.byDay.toUpperCase() : null);
    if (d && BYDAY.includes(d)) s += `;BYDAY=${d}`;
    return s;
  }
  /* items: [{id, title, date, start?, end?, notes?, rrule?}]; opts.now sets DTSTAMP (else the
     item's local midnight). An item without a valid date is left out. */
  function ics(items, opts) {
    const o = isObj(opts) ? opts : {};
    const stampNow = toDate(o.now);
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//1-addic//offline edition//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    arr(items).forEach((it, i) => {
      if (!isObj(it) || typeof it.date !== 'string' || !DATE_RE.test(it.date) || dateStr(toDate(it.date)) !== it.date) return;
      const sMin = toMin(it.start);
      const eMin = toMin(it.end);
      const stamp = stampNow || toDate(it.date);
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:${icsText(it.id != null && it.id !== '' ? it.id : `${it.date}-${i}`)}@1-addic`);
      lines.push(`DTSTAMP:${icsUtc(stamp)}`);
      if (isFinite(sMin)) {
        lines.push(`DTSTART:${icsDay(it.date)}T${hhmm(sMin).replace(':', '')}00`);
        if (isFinite(eMin)) {
          const endDay = eMin <= sMin ? addDays(it.date, 1) : it.date;
          lines.push(`DTEND:${icsDay(endDay)}T${hhmm(eMin).replace(':', '')}00`);
        }
      } else {
        lines.push(`DTSTART;VALUE=DATE:${icsDay(it.date)}`);
        lines.push(`DTEND;VALUE=DATE:${icsDay(addDays(it.date, 1))}`);
      }
      const rr = rruleOf(it.rrule);
      if (rr) lines.push(`RRULE:${rr}`);
      lines.push(`SUMMARY:${icsText(it.title || '1-addic')}`);
      if (it.notes != null && String(it.notes).trim()) lines.push(`DESCRIPTION:${icsText(it.notes)}`);
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
  }

  /* ── content: validateContent (BUILD-PLAN 3.2; tools/gates.py's validate gate) ───────────────── */

  /* The route table of BUILD-PLAN 3.5, by path (a query string is ignored). */
  const ROUTE_PATHS = new Set([
    '#/today', '#/learn', '#/learn/plan', '#/learn/glossary', '#/workbook', '#/track', '#/track/insights',
    '#/actions', '#/actions/planner', '#/actions/battle', '#/actions/review', '#/actions/quests', '#/actions/predictions', '#/actions/todos',
    '#/tools/trial', '#/tools/should-i-go', '#/tools/problem-solver',
    '#/games/big-game', '#/games/distortion-sort', '#/games/spot-red-flag', '#/games/refusal', '#/games/rewrite',
    '#/sos', '#/sos/craving', '#/sos/feeling', '#/sos/slip', '#/sos/urgent',
    '#/settings', '#/onboarding', '#/lock', '#/dev/fields',
  ]);
  const ROUTE_SETS = {
    workbook: new Set(['reasons', 'balance', 'motivation', 'triggers', 'redflags', 'journal', 'spiral', 'signature', 'anger', 'network', 'scripts', 'activities', 'balance-sw', 'distractions', 'warnings', 'plan', 'signs', 'risks']),
    practice: new Set(['breathe', 'body-scan', 'sober', 'urge-surf', 'shower', 'eating', 'walking']),
    settings: new Set(['privacy', 'look', 'rhythm', 'names', 'help', 'about', 'data']),
    log: new Set(['craving', 'feeling', 'checkin', 'activity', 'slip']),
  };
  /* The ids in a list of {id} rows or the keys of a map; null when absent. */
  function idSet(x) {
    if (Array.isArray(x)) return new Set(x.filter(isObj).map((r) => r.id).filter((v) => v != null));
    if (isObj(x)) return new Set(Object.keys(x));
    return null;
  }
  function lessonRows(content) {
    const out = [];
    for (const m of arr(content.modules)) for (const l of arr(m && m.lessons)) if (isObj(l)) out.push(l);
    return out;
  }
  function routeIndex(content) {
    return {
      modules: idSet(arr(content.modules)) || new Set(),
      lessons: idSet(lessonRows(content)) || new Set(),
      exercises: idSet(content.exercises),
    };
  }
  /* Why a route is not in the table, or null when it is. */
  function routeProblem(route, idx) {
    if (typeof route !== 'string' || !route.startsWith('#/')) return 'is not a hash route';
    const path = route.split('?')[0];
    if (ROUTE_PATHS.has(path)) return null;
    const p = path.slice(2).split('/');
    if (p.length === 2 && p[0] === 'learn') return idx.modules.has(p[1]) ? null : `names no module ${p[1]}`;
    if (p.length === 2 && p[0] === 'lesson') return idx.lessons.has(p[1]) ? null : `names no lesson ${p[1]}`;
    if (p.length === 2 && p[0] === 'exercise') return (!idx.exercises || idx.exercises.has(p[1])) && p[1] ? null : `names no exercise ${p[1]}`;
    if (p.length === 2 && ROUTE_SETS[p[0]] && p[0] !== 'log') return ROUTE_SETS[p[0]].has(p[1]) ? null : 'is not in the route table';
    if (p.length === 3 && p[0] === 'track' && p[1] === 'log') return ROUTE_SETS.log.has(p[2]) ? null : 'is not in the route table';
    return 'is not in the route table';
  }
  function knownRoute(route, content) {
    const c = isObj(content) ? content : C;

    if (!isObj(p)) fail('bad-profile', 'Profile details must be an object.');
    onlyKeys(p, PROFILE_KEYS, 'bad-profile', 'Profile');
    const C = getContent();
    const bad = (k) => fail('bad-profile', `Profile: "${k}" is not valid.`);
    const has = (k) => !absent(p, k);
    if (has('name') && !isText(p.name, 80)) bad('name');
    if (has('companion') && !isText(p.companion, 40)) bad('companion');
    if (has('substances') && !(Array.isArray(p.substances) && p.substances.length <= 20 && p.substances.every((s) => isName(s, 120)))) bad('substances');
    if (has('term') && !(typeof p.term === 'string' && known(C.terms, p.term))) bad('term');
    if (has('startDate') && !(p.startDate === null || p.startDate === '' || isDate(p.startDate))) bad('startDate');
    if (has('notSure') && !isBool(p.notSure)) bad('notSure');
    if (has('stage') && !(p.stage === null || (typeof p.stage === 'string' && known(C.stages, p.stage)))) bad('stage');
    if (has('region') && !['in', 'intl'].includes(p.region)) bad('region');
    if (has('checkin')) {
      if (!isObj(p.checkin)) bad('checkin');
      onlyKeys(p.checkin, ['morning', 'evening'], 'bad-profile', 'Check-in times');
      for (const k of ['morning', 'evening']) if (!absent(p.checkin, k) && !(p.checkin[k] === null || p.checkin[k] === '' || isTime(p.checkin[k]))) bad('checkin');
    }
    if (has('reviewDay') && !isInt(p.reviewDay, 0, 6)) bad('reviewDay');
    if (has('pace') && !(typeof p.pace === 'string' && (p.pace === 'custom' || known(C.paces, p.pace)))) bad('pace');
    if (has('customPerWeek') && !(p.customPerWeek === null || (typeof p.customPerWeek === 'number' && p.customPerWeek > 0 && p.customPerWeek <= 7))) bad('customPerWeek');
    if (has('roadmapStart') && !(p.roadmapStart === null || isDate(p.roadmapStart))) bad('roadmapStart');
    if (has('medical')) {
      if (!isObj(p.medical)) bad('medical');
      onlyKeys(p.medical, MEDICAL_KEYS, 'bad-profile', 'Medical safety');
      for (const k of Object.keys(p.medical)) if (!isBool(p.medical[k])) bad('medical');
    }
  }
  function settingsRow(prev) {
    return Object.assign({}, clone(SETTINGS_DEFAULTS), prev || {}, { key: 'app' });
  }

  async function onboard(patch) {
    checkProfile(patch);
    const at = stamp();
    const p = clone(patch);
    return write('onboard', at, (tx) => {
      const prev = tx.get('profile', 'me');
      const firstTerm = idsOf(getContent().terms);
      const base = { key: 'me', name: '', companion: '', substances: [], term: firstTerm ? firstTerm[0] : 'sober', startDate: null,
        notSure: false, stage: null, region: 'in', checkin: { morning: null, evening: null }, reviewDay: 0, pace: 'steady',
        customPerWeek: null, roadmapStart: localDate(at), onboardedAt: at, medical: { heavyDaily: false, sedatives: false, opioids: false }, locale: 'en' };
      const profile = Object.assign({}, base, prev || {}, p);
      profile.checkin = Object.assign({}, base.checkin, prev && prev.checkin, p.checkin);
      profile.medical = Object.assign({}, base.medical, prev && prev.medical, p.medical);
      profile.key = 'me';
      profile.locale = 'en';
      profile.onboardedAt = (prev && prev.onboardedAt) || at;
      tx.put('profile', profile);
      const settings = settingsRow(tx.get('settings', 'app'));
      tx.put('settings', settings);
      if (!tx.has('OnboardingCompleted')) tx.event('OnboardingCompleted', {});
      return { profile, settings, events: tx.events };
    });
  }

  async function patchSettings(patch) {
    if (!isObj(patch)) fail('bad-setting', 'Settings must be an object.');
    for (const k of Object.keys(patch)) {
      if (!own(SETTING_RULES, k)) fail('bad-setting', `Unknown setting "${k}".`);
      if (!SETTING_RULES[k](patch[k])) fail('bad-setting', `Setting "${k}" is not valid.`);
    }
    const at = stamp();
    const p = clone(patch);
    return write('settings', at, (tx) => {
      const prev = settingsRow(tx.get('settings', 'app'));
      const next = Object.assign({}, prev, p, { key: 'app' });
      /* milestones seen are a record: they only grow */
      if (own(p, 'milestonesSeen')) next.milestonesSeen = [...new Set([...(prev.milestonesSeen || []), ...p.milestonesSeen])].sort((a, b) => a - b);
      tx.put('settings', next);
      return next;
    });
  }

  /* ── recordEvent ─────────────────────────────────────────────────────────────────────────── */
  async function recordEvent(type, payload) {
    if (!EVENT_TYPES.includes(type)) fail('bad-event', `Unknown event type "${type}".`);
    const pl = payload === undefined ? {} : payload;
    if (!isObj(pl) || jsonSize(pl) > 5000) fail('bad-event', 'An event payload must be a small object.');
    const need = NEEDS[type] || {};
    for (const k of Object.keys(need)) if (!need[k](pl[k])) fail('bad-event', `${type}: "${k}" is missing or not valid.`);
    if (type === 'MindfulMinute' && !absent(pl, 'minutes') && !isInt(pl.minutes, 1, 600)) fail('bad-event', 'MindfulMinute: "minutes" is not valid.');
    const at = stamp();
    const p = clone(pl);
    return write(`event ${type}`, at, (tx) => {
      if (!onceDone(tx, type, p)) tx.event(type, p);
      return { events: tx.events };
    });
  }

  /* ── logs ────────────────────────────────────────────────────────────────────────────────── */
  function checkSkills(list, code) {
    if (!Array.isArray(list) || list.length > 20) fail(code, 'Skills must be a short list.');
    const C = getContent();
    return list.map((s) => {
      const t = typeof s === 'string' ? { skillId: s, helpful: false } : s;
      if (!isObj(t) || !isId(t.skillId) || !known(C.skills, t.skillId)) fail(code, 'Unknown skill.');
      if (!absent(t, 'helpful') && !isBool(t.helpful)) fail(code, 'A skill\'s "helpful" must be true or false.');
      return { skillId: t.skillId, helpful: t.helpful === true };
    });
  }
  const LOG_KEYS = ['intensity', 'triggerIds', 'thought', 'redFlag', 'feelings', 'skills', 'notes', 'emotion'];
  function checkLog(e) {
    const code = 'bad-log';
    if (!isObj(e)) fail(code, 'A log must be an object.');
    onlyKeys(e, LOG_KEYS, code, 'Log');
    if (!isScore(e.intensity)) fail(code, 'Intensity must be a whole number from 0 to 10.');
    for (const k of ['triggerIds', 'feelings']) {
      if (!absent(e, k) && !(Array.isArray(e[k]) && e[k].length <= 40 && e[k].every((x) => isName(x, 120)))) fail(code, `"${k}" must be a list of short labels.`);
    }
    for (const k of ['thought', 'notes']) if (!absent(e, k) && !isText(e[k], k === 'notes' ? 2000 : 500)) fail(code, `"${k}" is too long.`);
    if (!absent(e, 'redFlag') && !(isBool(e.redFlag) || isText(e.redFlag, 500))) fail(code, '"redFlag" is not valid.');
    if (!absent(e, 'emotion') && !(e.emotion === null || (typeof e.emotion === 'string' && known(getContent().emotions, e.emotion)))) fail(code, 'Unknown emotion.');
    return absent(e, 'skills') ? [] : checkSkills(e.skills, code);
  }
  function logRow(type, at, extra) {
    return Object.assign({ id: newId(), type, at, date: localDate(at), hour: hourOf(at), triggerIds: [], feelings: [], skills: [] }, extra, { drill: false });
  }
  function writeLog(kind, e) {
    const skills = checkLog(e);
    const at = stamp();
    const p = clone(e);
    return write(`log ${kind}`, at, (tx) => {
      const log = tx.put('logs', logRow(kind, at, {
        intensity: p.intensity, emotion: p.emotion || null, triggerIds: p.triggerIds || [], thought: p.thought || '',
        redFlag: absent(p, 'redFlag') ? null : p.redFlag, feelings: p.feelings || [], skills, notes: p.notes || '',
      }));
      tx.event('LogCreated', { logId: log.id, type: kind });
      for (const s of skills) tx.event('SkillUsed', { skillId: s.skillId, helpful: s.helpful, logId: log.id });
      return { log, events: tx.events };
    });
  }
  const logCraving = async (e) => writeLog('craving', e);
  const logFeeling = async (e) => writeLog('feeling', e);

  const CHECKIN_KEYS = ['mood', 'anxiety', 'peakCraving', 'pleasantCount', 'used', 'sleep', 'meeting', 'intention'];
  async function checkin(kind, data) {
    const code = 'bad-checkin';
    if (!['morning', 'evening'].includes(kind)) fail(code, 'A check-in is morning or evening.');
    const d = data === undefined ? {} : data;
    if (!isObj(d)) fail(code, 'A check-in must be an object.');
    onlyKeys(d, CHECKIN_KEYS, code, 'Check-in');
    for (const k of ['mood', 'anxiety', 'peakCraving']) if (!absent(d, k) && d[k] !== null && !isScore(d[k])) fail(code, `"${k}" must be 0 to 10.`);
    if (!absent(d, 'pleasantCount') && !isInt(d.pleasantCount, 0, 50)) fail(code, '"pleasantCount" is not valid.');
    for (const k of ['used', 'meeting']) if (!absent(d, k) && d[k] !== null && !isBool(d[k])) fail(code, `"${k}" must be yes or no.`);
    if (!absent(d, 'sleep') && d.sleep !== null && !(typeof d.sleep === 'number' && d.sleep >= 0 && d.sleep <= 24)) fail(code, '"sleep" is hours from 0 to 24.');
    if (!absent(d, 'intention') && !isText(d.intention, 300)) fail(code, '"intention" is too long.');
    const at = stamp();
    const c = Object.assign({ kind }, clone(d), { kind });
    return write(`checkin ${kind}`, at, (tx) => {
      const log = tx.put('logs', logRow('checkin', at, { checkin: c }));
      tx.event('CheckinCompleted', { logId: log.id, kind });
      return { log, events: tx.events };
    });
  }

  const ACTIVITY_KINDS = ['exercise', 'mindfulness', 'meeting', 'pleasant'];
  async function logActivity(data) {
    const code = 'bad-activity';
    if (!isObj(data)) fail(code, 'An activity must be an object.');
    onlyKeys(data, ['kind', 'minutes', 'name', 'enjoyment'], code, 'Activity');
    if (!ACTIVITY_KINDS.includes(data.kind)) fail(code, 'Unknown kind of activity.');
    if (!isInt(data.minutes, 1, 1440)) fail(code, 'Minutes must be a whole number from 1 to 1440.');
    if (!absent(data, 'name') && !isText(data.name, 120)) fail(code, '"name" is too long.');
    if (!absent(data, 'enjoyment') && data.enjoyment !== null && !isScore(data.enjoyment)) fail(code, '"enjoyment" must be 0 to 10.');
    const at = stamp();
    const a = { kind: data.kind, minutes: data.minutes, name: data.name || '', enjoyment: absent(data, 'enjoyment') ? null : data.enjoyment };
    return write('log activity', at, (tx) => {
      const log = tx.put('logs', logRow('activity', at, { activity: a }));
      tx.event('ActivityDone', { kind: a.kind, minutes: a.minutes, logId: log.id });
      return { log, events: tx.events };
    });
  }

  /* A slip adds one row and one SlipLogged; startDate, counters, XP, mastery and badges are never touched. */
  async function logSlip(data) {
    const code = 'bad-slip';
    const d = data === undefined ? {} : data;
    if (!isObj(d)) fail(code, 'A slip must be an object.');
    onlyKeys(d, ['date', 'substance', 'situation', 'notes'], code, 'Slip');
    const at = stamp();
    const date = absent(d, 'date') ? localDate(at) : d.date;
    if (!isDate(date) || date > localDate(at)) fail(code, 'The date must be today or earlier.');
    if (!absent(d, 'substance') && !isText(d.substance, 120)) fail(code, '"substance" is too long.');
    if (!absent(d, 'situation') && !isText(d.situation, 1000)) fail(code, '"situation" is too long.');
    if (!absent(d, 'notes') && !isText(d.notes, 2000)) fail(code, '"notes" is too long.');
    return write('log slip', at, (tx) => {
      const log = tx.put('logs', logRow('slip', at, { date, used: true, substance: d.substance || '', situation: d.situation || '', notes: d.notes || '' }));
      tx.event('SlipLogged', { date, logId: log.id });
      return { log, events: tx.events };
    });
  }

  /* ── SOS ─────────────────────────────────────────────────────────────────────────────────── */
  const SOS_KEYS = ['kind', 'ratingBefore', 'ratingAfter', 'tools', 'delays', 'used', 'risky', 'outcome', 'drill'];
  const OUTCOMES = ['passed', 'still', 'used'];
  function checkSession(s) {
    const code = 'bad-session';
    if (!isObj(s)) fail(code, 'An SOS session must be an object.');
    onlyKeys(s, SOS_KEYS, code, 'SOS session');
    if (!['craving', 'feeling', 'slip'].includes(s.kind)) fail(code, 'An SOS session is a craving, a feeling or a slip.');
    for (const k of ['ratingBefore', 'ratingAfter']) if (!absent(s, k) && s[k] !== null && !isScore(s[k])) fail(code, `"${k}" must be 0 to 10.`);
    const tools = absent(s, 'tools') ? [] : checkSkills(s.tools, code);
    if (!absent(s, 'delays') && !isInt(s.delays, 0, 100)) fail(code, '"delays" is not valid.');
    for (const k of ['used', 'risky', 'drill']) if (!absent(s, k) && !isBool(s[k])) fail(code, `"${k}" must be true or false.`);
    if (!absent(s, 'outcome') && !OUTCOMES.includes(s.outcome)) fail(code, 'Unknown outcome.');
    const used = s.kind === 'slip' || s.used === true;
    if (!absent(s, 'outcome') && (s.outcome === 'used') !== used) fail(code, 'The outcome does not match "used".');
    const before = absent(s, 'ratingBefore') ? null : s.ratingBefore;
    const after = absent(s, 'ratingAfter') ? null : s.ratingAfter;
    let outcome = absent(s, 'outcome') ? null : s.outcome;
    if (!outcome) outcome = used ? 'used' : (before !== null && after !== null && after > 0 && after >= before) ? 'still' : 'passed';
    return { kind: s.kind, ratingBefore: before, ratingAfter: after, tools, delays: absent(s, 'delays') ? 0 : s.delays,
      used, risky: s.risky === true, outcome, drill: s.drill === true };
  }
  async function sosSession(s) {
    const v = checkSession(s);
    const at = stamp();
    if (v.drill) {
      /* a rehearsal: no log, no skill, no XP for the session, no slip; only the drill's tutorial mark, once */
      const S = store();
      const seen = (S.view && typeof S.view.list === 'function' ? S.view.list('events') || [] : [])
        .some((e) => e && e.type === 'TutorialCompleted' && e.payload && e.payload.id === 'drill');
      if (seen) return { drill: true, events: [] };
      return write('sos drill', at, (tx) => {
        if (!tx.has('TutorialCompleted', 'id', 'drill')) tx.event('TutorialCompleted', { id: 'drill', skipped: false });
        return { drill: true, events: tx.events };
      });
    }
    return write(`sos ${v.kind}`, at, (tx) => {
      const log = tx.put('logs', logRow(v.kind, at, {
        intensity: v.ratingBefore, skills: v.tools, used: v.used,
        sos: { ratingBefore: v.ratingBefore, ratingAfter: v.ratingAfter, delays: v.delays, risky: v.risky, outcome: v.outcome },
      }));
      tx.event('LogCreated', { logId: log.id, type: v.kind });
      for (const t of v.tools) tx.event('SkillUsed', { skillId: t.skillId, helpful: t.helpful, logId: log.id });
      tx.event('SosCompleted', { kind: v.kind, outcome: v.outcome, ratingBefore: v.ratingBefore, ratingAfter: v.ratingAfter, delays: v.delays, logId: log.id });
      if (v.used) tx.event('SlipLogged', { date: log.date, logId: log.id });
      return { log, events: tx.events };
    });
  }

  /* ── learning ────────────────────────────────────────────────────────────────────────────── */
  const modules = () => (Array.isArray(getContent().modules) ? getContent().modules : []);
  const moduleOf = (moduleId) => modules().find((m) => m && m.id === moduleId) || null;
  const moduleOfLesson = (lessonId) => modules().find((m) => m && Array.isArray(m.lessons) && m.lessons.some((l) => l && l.id === lessonId)) || null;
  function lessonsAllDone(tx, m, plus) {
    const ls = Array.isArray(m.lessons) ? m.lessons : [];
    return ls.every((l) => l.id === plus || tx.has('LessonCompleted', 'lessonId', l.id));
  }
  async function completeLesson(lessonId) {
    if (!isId(lessonId) || (modules().length && !moduleOfLesson(lessonId))) fail('unknown-lesson', 'Unknown lesson.');
    const at = stamp();
    return write(`lesson ${lessonId}`, at, (tx) => {
      if (!tx.has('LessonCompleted', 'lessonId', lessonId)) {
        tx.event('LessonCompleted', { lessonId });
        const m = moduleOfLesson(lessonId);
        if (m && lessonsAllDone(tx, m) && tx.has('CheckpointCompleted', 'moduleId', m.id) && !tx.has('ModuleCompleted', 'moduleId', m.id)) {
          tx.event('ModuleCompleted', { moduleId: m.id });
        }
      }
      return { events: tx.events };
    });
  }
  async function checkpoint(moduleId, answers) {
    const code = 'bad-checkpoint';
    if (!isId(moduleId) || (modules().length && !moduleOf(moduleId))) fail(code, 'Unknown module.');
    if (!Array.isArray(answers) || answers.length > 50 || jsonSize(answers) > 20000) fail(code, 'Answers must be a short list.');
    const at = stamp();
    return write(`checkpoint ${moduleId}`, at, (tx) => {
      if (!tx.has('CheckpointCompleted', 'moduleId', moduleId)) tx.event('CheckpointCompleted', { moduleId });
      const m = moduleOf(moduleId);
      if ((!m || lessonsAllDone(tx, m)) && !tx.has('ModuleCompleted', 'moduleId', moduleId)) tx.event('ModuleCompleted', { moduleId });
      return { events: tx.events };
    });
  }

  /* ── responses (append-only; the latest non-draft is the artifact) ───────────────────────── */
  const DONE_KINDS = ['practice', 'reflect', 'tool'];
  function exerciseKind(exerciseId) {
    const ex = getContent().exercises;
    if (!ex) return { known: isId(exerciseId), kind: null };
    const row = Array.isArray(ex) ? ex.find((x) => x && x.id === exerciseId) : (isObj(ex) && own(ex, exerciseId) ? ex[exerciseId] : null);
    return row ? { known: true, kind: row.kind || null } : { known: false, kind: null };
  }
  function responseRow(exerciseId, payload, at, mode, draft) {
    return { id: newId(), exerciseId, schemaVersion: Number(getContent().schemaVersion) || 1, payload, at, mode, draft };
  }
  async function saveResponse(exerciseId, payload, opts) {
    const ex = typeof exerciseId === 'string' ? exerciseKind(exerciseId) : { known: false };
    if (!ex.known) fail('unknown-exercise', 'Unknown exercise.');
    if (!(isObj(payload) || Array.isArray(payload)) || jsonSize(payload) > 200000) fail('bad-response', 'An answer must be an object or a list.');
    const o = opts === undefined ? {} : opts;
    if (!isObj(o)) fail('bad-response', 'Options must be an object.');
    onlyKeys(o, ['mode', 'draft'], 'bad-response', 'Options');
    const mode = absent(o, 'mode') ? 'workbook' : o.mode;
    if (!['tutorial', 'workbook'].includes(mode)) fail('bad-response', 'Mode is tutorial or workbook.');
    if (!absent(o, 'draft') && !isBool(o.draft)) fail('bad-response', '"draft" must be true or false.');
    const draft = o.draft === true;
    const at = stamp();
    const p = clone(payload);
    return write(`response ${exerciseId}`, at, (tx) => {
      const response = tx.put('responses', responseRow(exerciseId, p, at, mode, draft));
      if (!draft) {
        const type = DONE_KINDS.includes(ex.kind) ? 'ExerciseDone' : 'ArtifactSaved';
        tx.event(type, { exerciseId, kind: ex.kind, responseId: response.id });
      }
      return { response, events: tx.events };
    });
  }

  /* ── contacts (stay on the device; deactivated, never deleted) ───────────────────────────── */
  const ROLES = ['safetyNet', 'risky', 'sponsor', 'therapist', 'other'];
  const STRATEGIES = ['avoid', 'limit', 'setLimits'];
  const PHONE_RE = /^[0-9+()\-.\s]{3,24}$/;
  const REACH = ['call', 'text', 'meet', 'other'];
  function checkContact(c, partial) {
    const code = 'bad-contact';
    if (!isObj(c)) fail(code, 'A contact must be an object.');
    onlyKeys(c, partial ? ['name', 'role', 'strategy', 'phone', 'note', 'active'] : ['name', 'role', 'strategy', 'phone', 'note'], code, 'Contact');
    if ((!partial || !absent(c, 'name')) && !isName(c.name, 80)) fail(code, 'A contact needs a name.');
    if (!absent(c, 'role') && !ROLES.includes(c.role)) fail(code, 'Unknown role.');
    if (!absent(c, 'strategy') && c.strategy !== null && !STRATEGIES.includes(c.strategy)) fail(code, 'Unknown strategy.');
    if (!absent(c, 'phone') && c.phone !== '' && !(typeof c.phone === 'string' && PHONE_RE.test(c.phone))) fail(code, 'That phone number does not look right.');
    if (!absent(c, 'note') && !isText(c.note, 300)) fail(code, '"note" is too long.');
    if (!absent(c, 'active') && !isBool(c.active)) fail(code, '"active" must be true or false.');
  }
  function needRow(tx, s, id, code, what) {
    const row = tx.get(s, id);
    if (!row) fail(code, `${what} not found.`);
    return row;
  }
  const contacts = {
    async add(c) {
      checkContact(c, false);
      const at = stamp();
      const p = clone(c);
      return write('contact add', at, (tx) => tx.put('contacts', {
        id: newId(), name: p.name.trim(), role: p.role || 'safetyNet', strategy: p.strategy || null, phone: p.phone || '',
        note: p.note || '', active: true, at,
      }));
    },
    async update(id, patch) {
      if (!isId(id)) fail('bad-contact', 'Contact not found.');
      checkContact(patch, true);
      const p = clone(patch);
      if (typeof p.name === 'string') p.name = p.name.trim();
      return write('contact update', stamp(), (tx) => tx.put('contacts', Object.assign({}, needRow(tx, 'contacts', id, 'bad-contact', 'Contact'), p, { id })));
    },
    async deactivate(id) {
      if (!isId(id)) fail('bad-contact', 'Contact not found.');
      return write('contact deactivate', stamp(), (tx) => tx.put('contacts', Object.assign({}, needRow(tx, 'contacts', id, 'bad-contact', 'Contact'), { active: false })));
    },
    async reached(id, how) {
      if (!isId(id)) fail('bad-contact', 'Contact not found.');
      if (!REACH.includes(how)) fail('bad-contact', 'Reached out how: call, text, meet or other.');
      return write('contact reached', stamp(), (tx) => {
        needRow(tx, 'contacts', id, 'bad-contact', 'Contact');
        tx.event('ContactReached', { contactId: id, how });
        return { events: tx.events };
      });
    },
  };

  /* ── plans, weekly review, to-dos ────────────────────────────────────────────────────────── */
  const PLAN_KINDS = ['should', 'want', 'recovery', 'risky'];
  const PLAN_STATUS = ['planned', 'done', 'skipped'];
  function checkBattlePlan(b) {
    const code = 'bad-plan';
    if (!isObj(b)) fail(code, 'A Battle Plan must be an object.');
    onlyKeys(b, ['situation', 'plan', 'backups', 'buddyId', 'exit'], code, 'Battle Plan');
    for (const k of ['situation', 'plan', 'exit']) if (!absent(b, k) && !isText(b[k], 1000)) fail(code, `"${k}" is too long.`);
    if (!absent(b, 'backups') && !(Array.isArray(b.backups) && b.backups.length <= 10 && b.backups.every((x) => isText(x, 300)))) fail(code, '"backups" must be a short list.');
    if (!absent(b, 'buddyId') && b.buddyId !== null && !isId(b.buddyId)) fail(code, '"buddyId" is not valid.');
  }
  function checkPlan(p, partial) {
    const code = 'bad-plan';
    if (!isObj(p)) fail(code, 'A plan item must be an object.');
